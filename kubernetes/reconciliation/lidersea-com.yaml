apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lidersea-com
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-prerequisites
    - name: admission
    - name: platform-services
  interval: 10m0s
  path: ./kubernetes/websites/lidersea-com
  prune: true
  retryInterval: 1m0s
  serviceAccountName: lidersea-com-reconciler
  sourceRef:
    kind: GitRepository
    name: flux-system
  suspend: true
  timeout: 5m0s
  # The contained HelmRelease and the namespace's zero-Pod quota are separate
  # fail-closed gates. HelmRelease status becomes the health boundary only
  # after measured capacity and release evidence permit explicit activation.
  wait: false
