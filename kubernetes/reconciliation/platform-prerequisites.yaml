apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-prerequisites
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/platform/prerequisites
  prune: true
  retryInterval: 1m0s
  serviceAccountName: platform-prerequisites-reconciler
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 3m0s
  wait: true
