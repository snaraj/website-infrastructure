apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: admission
  namespace: flux-system
  annotations:
    platform.snaraj.dev/readiness: suspended-until-reviewed-kyverno-artifact-digests-rbac-and-runtime-evidence
spec:
  dependsOn:
    - name: platform-prerequisites
  interval: 10m0s
  path: ./kubernetes/platform/admission
  prune: true
  retryInterval: 1m0s
  serviceAccountName: admission-reconciler
  sourceRef:
    kind: GitRepository
    name: flux-system
  # This is an explicit staging stop. Removing suspend is insufficient for
  # promotion: wait must observe a reviewed, functional controller and enforced
  # policies before any dependent reconciliation becomes eligible.
  suspend: true
  timeout: 5m0s
  wait: true
