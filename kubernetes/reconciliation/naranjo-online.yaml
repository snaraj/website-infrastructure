apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: naranjo-online
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-prerequisites
    - name: admission
    - name: platform-services
  interval: 10m0s
  path: ./kubernetes/websites/naranjo-online
  prune: true
  retryInterval: 1m0s
  serviceAccountName: naranjo-online-reconciler
  sourceRef:
    kind: GitRepository
    name: flux-system
  suspend: true
  timeout: 5m0s
  # The contained HelmRelease and the namespace's zero-Pod quota are separate
  # fail-closed gates. HelmRelease status is the health boundary after activation.
  wait: false
