apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-budget
  namespace: cloudflare-public
spec:
  hard:
    limits.cpu: "2"
    limits.memory: 1Gi
    pods: "6"
    requests.cpu: 500m
    requests.memory: 512Mi
    secrets: "8"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: cloudflare-public
spec:
  limits:
    - default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      type: Container
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: capacity-not-ready
  namespace: naranjo-online
  annotations:
    platform.snaraj.dev/readiness: blocked-until-pi-capacity-evidence
spec:
  hard:
    # The Pi workload envelope is still unmeasured. Zero Pods is an explicit,
    # reversible admission gate rather than an invented CPU or memory budget.
    pods: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: naranjo-online
spec:
  limits:
    - default:
        cpu: 200m
        memory: 128Mi
      defaultRequest:
        cpu: 25m
        memory: 32Mi
      type: Container
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: capacity-not-ready
  namespace: lidersea-com
  annotations:
    platform.snaraj.dev/readiness: blocked-until-pi-capacity-evidence
spec:
  hard:
    # Promotion must replace this gate with a measured, reviewed namespace
    # envelope before either replica is admitted on the production Pi.
    pods: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: lidersea-com
spec:
  limits:
    - default:
        cpu: 200m
        memory: 128Mi
      defaultRequest:
        cpu: 25m
        memory: 32Mi
      type: Container
