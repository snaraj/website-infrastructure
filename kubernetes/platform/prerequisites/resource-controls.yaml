    platform.snaraj.dev/capacity-evidence-sha256: 955a59cbf5ba0bd36f5e62349ed070a2b1eba6fb3ef072951435010edcceaf34
spec:
  hard:
    # The measured envelope this site was waiting for now exists (issue #201),
    # so the promotion gate is replaced rather than deleted. The ceiling is
    # deliberately NOT the current replica count: a budget equal to
