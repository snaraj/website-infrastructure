    # rollout, and growth.
    pods: "6"
    # Every quantity scales with the Pod ceiling from this site's own measured
    # per-Pod figures. Raising `pods` alone would be cosmetic: the previous
    # budget capped limits.memory at exactly two Pods' worth, so a third Pod
    # could not have scheduled whatever the Pod ceiling said.
    requests.cpu: 150m
    requests.memory: 192Mi
    limits.cpu: 1200m
    limits.memory: 768Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: lidersea-com
spec:
  limits:
    - default:
        cpu: 200m
