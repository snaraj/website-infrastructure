# Dated single-node sizing and scheduling, applied to every Kyverno Deployment
# by label so a promotion render that adds a controller cannot ship an
# unbounded one. Replica count deliberately remains owned by the reviewed
# controller export: it is a capacity/availability decision, never a security
# invariant, and a future HA control plane must be able to use multiple replicas
# and failure domains without deleting an admission guard.
#
# The current sentinel export happens to declare one replica for the one-node
# Pi. The capacity contract checks every positive desired replica plus rollout
# surge against ResourceQuota; no patch here forces equality to one.
#
# priorityClassName: system-cluster-critical — deliberately ABOVE the sites.
# Under memory pressure the kubelet must not evict the admission controller:
# with the enforcing webhook registered, an evicted Kyverno turns every write
# the webhook matches into a failure. Bounded consumption is the ResourceQuota's
# job; not being the first thing killed is this field's job. The Flux
# controllers already ship at this class, so admission is not being singled out.
#
# resources — 100m/192Mi requested, 500m/384Mi ceiling, per controller. See
# ../resource-controls.yaml for the arithmetic against the node envelope.
- op: add
  path: /spec/template/spec/priorityClassName
  value: system-cluster-critical
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 384Mi
