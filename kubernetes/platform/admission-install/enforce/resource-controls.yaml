# Hard bounds on what admission may consume, so the controller that protects
# the sites can never be the reason a site cannot schedule.
#
# The arithmetic these numbers come from (node envelope recorded 2026-08-12;
# revalidate read-only before the ceremony, it is a dated observation, not a
# constant):
#
#   node allocatable                     3250m CPU   5502Mi memory
#   requested after the Flux install     1500m CPU    624Mi memory
#   headroom                             1750m CPU   4878Mi memory
#
#   Kyverno steady state, 2 controllers x 1 replica x (100m / 192Mi)
#                                         200m CPU    384Mi memory
#                                        = 11.4% of CPU headroom
#                                        =  7.9% of memory headroom
#   remaining for sites and connectors   1550m CPU   4494Mi memory
#
# The ResourceQuota is the part that matters: it is enforced by the API server,
# so the bound survives a future render that adds controllers, a replica-count
# mistake, or a values change nobody re-derived. Steady state uses half of the
# request quota; the other half is the rolling-update surge.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-budget
  namespace: kyverno
spec:
  hard:
    # 2 controllers + 2 surge replicas during a rolling update, and nothing else.
    pods: "4"
    requests.cpu: 400m
    requests.memory: 768Mi
    # Burst ceiling, not a reservation. 1536Mi is 31.5% of the memory headroom,
    # so a runaway admission controller is OOM-killed inside its own budget
    # instead of pushing a site Pod that is within its request off the node.
    limits.cpu: "2"
    limits.memory: 1536Mi
    # Kyverno generates its own webhook-serving certificate Secrets; a bound
    # keeps a certificate-rotation defect from becoming unbounded etcd growth.
    secrets: "8"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: kyverno
spec:
  limits:
    # Defaults matching the patched controller values, so a container that the
    # promotion render adds without explicit resources still lands inside the
    # quota instead of being rejected for having none.
    - default:
        cpu: 500m
        memory: 384Mi
      defaultRequest:
        cpu: 100m
        memory: 192Mi
      type: Container
