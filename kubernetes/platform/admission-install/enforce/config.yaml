# Kyverno's engine configuration — the single most important object in this
# root, because it is what stops an admission controller from locking the
# cluster out of its own control plane.
#
# Two independent exclusion layers, deliberately not one:
#
#   1. `resourceFilters` is evaluated by the engine BEFORE any policy runs, on
#      every admission request and every background scan. Its `[Kind,Namespace,
#      Name]` grammar has been stable across Kyverno majors, which is why the
#      control-plane, Flux, and self-exclusions live here rather than only in
#      the webhook selector.
#   2. `webhooks` sets a namespaceSelector on the RESOURCE webhooks Kyverno
#      registers, so excluded namespaces never reach the webhook at all — the
#      API server does not even call out. If the controller is unreachable,
#      requests in those namespaces are unaffected regardless of failurePolicy.
#
# The three exclusions that prevent lockout, and why each one:
#
#   kube-system  — the control plane's own workloads. Intercepting them means a
#                  webhook outage can stop CoreDNS, the CNI, or a static Pod
#                  mirror from being written, which is unrecoverable without
#                  break-glass.
#   flux-system  — the reconciler that would otherwise be the recovery path.
#                  Admission must never be able to block the thing that repairs
#                  admission.
#   kyverno      — self-exclusion. A controller that must pass its own webhook
#                  to start cannot start after a restart.
#
# This ConfigMap is REVIEWED here rather than generated: the promotion render
# must be produced with the chart's `config.create=false` so these bytes are the
# only source of the engine's configuration. See docs/runbooks/kyverno-install.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kyverno
  namespace: kyverno
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: kyverno
data:
  # Off by default upstream and kept off: success events on a single-node Pi are
  # pure etcd write amplification for no admission property.
  generateSuccessEvents: "false"
  # Upstream defaults to mutating unqualified image references to a default
  # registry. This platform requires fully qualified digests at admission
  # (policies/kyverno/require-approved-images.yaml); silently rewriting a
  # reference would let a short name pass a check written for a long one.
  enableDefaultRegistryMutation: "false"
  # The node's own kubelet identity. Without this, every static Pod and every
  # kubelet-initiated write is evaluated by policies written for tenant
  # workloads, and a webhook outage becomes a node outage.
  excludeGroups: system:nodes
  # Engine-level exclusions. The first block is upstream's reviewed default set
  # for v1.18.2 (high-churn and control-plane-internal kinds); the second block
  # is this platform's addition and is the load-bearing part.
  resourceFilters: >-
    [Event,*,*]
    [*/*,kube-system,*]
    [*/*,kube-public,*]
    [*/*,kube-node-lease,*]
    [Node,*,*]
    [Node/?*,*,*]
    [APIService,*,*]
    [APIService/?*,*,*]
    [TokenReview,*,*]
    [SubjectAccessReview,*,*]
    [SelfSubjectAccessReview,*,*]
    [Binding,*,*]
    [Pod/binding,*,*]
    [EphemeralReport,*,*]
    [ClusterEphemeralReport,*,*]
    [*/*,flux-system,*]
    [*/*,kyverno,*]
  # Webhook-level exclusion. Kyverno stamps this selector onto every resource
  # webhook it registers, so the API server never calls out for a request in
  # these namespaces. The value is a JSON object (Kyverno v1.18 shape); the
  # installer parses it and refuses an install whose selector does not carry all
  # three NotIn values.
  webhooks: '{"namespaceSelector":{"matchExpressions":[{"key":"kubernetes.io/metadata.name","operator":"NotIn","values":["kube-system","flux-system","kyverno"]}]}}'
