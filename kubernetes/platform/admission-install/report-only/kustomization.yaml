# STAGE 1 — fail-open staging. This is what gets applied FIRST, always.
#
# Why an admission controller is never installed enforcing:
#
# A ValidatingWebhookConfiguration with `failurePolicy: Fail` tells the API
# server to REJECT any request it cannot get an answer for. Registered before
# the backend is proven — wrong Service, wrong port, unissued certificate,
# denied egress, unscheduled Pod — it converts every matching write in the
# cluster into a 500. On a single-node cluster with no second control plane and
# no second operator, that is the highest-blast-radius state this platform can
# enter, and it is reached by a single successful `kubectl apply`.
#
# This overlay makes the first apply incapable of that. It takes the stage-2
# root unchanged and applies exactly two kinds of downgrade:
#
#   spec.webhookConfiguration.failurePolicy: Fail -> Ignore
#       An unreachable or slow webhook is IGNORED by the API server. The write
#       proceeds. A broken install degrades to "no admission control", which is
#       precisely the state the cluster is in today, and never to "no writes".
#
#   validationFailureAction / validate.failureAction: Enforce -> Audit
#       Policies evaluate and REPORT. Every violation lands in a PolicyReport
#       instead of a rejection, so the real blast radius of enforcement is
#       measured against real traffic before anything is enforced.
#
# Nothing else differs between the stages: same controller export, same
# digests, same namespace, same bounds, same network, same policy logic. The
# suite asserts that — the two renders may differ ONLY in those three fields.
#
# The promotion out of this stage is a separate reviewed transition with its own
# gate. scripts/install-kyverno-admission.sh refuses `--stage enforce` unless
# the live cluster proves this stage ran: controllers Available, every policy
# present, and at least one policy report produced. Stage 1 cannot be skipped.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../enforce
patches:
  # Every policy, by kind: the webhook must not be able to block, and the
  # spec-level action falls back to reporting.
  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
    patch: |
      - op: replace
        path: /spec/validationFailureAction
        value: Audit
      - op: replace
        path: /spec/webhookConfiguration/failurePolicy
        value: Ignore
  # Per-rule actions. Kyverno prefers the rule's own `validate.failureAction`
  # over the deprecated spec-level field, so the patch above alone would leave
  # every rule enforcing. These are enumerated per policy and per rule index.
  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: require-restricted-workloads
    path: patches/audit-require-restricted-workloads.yaml
  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: disallow-public-services
    path: patches/audit-disallow-public-services.yaml
  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: require-approved-images
    path: patches/audit-require-approved-images.yaml
  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: disallow-undiscovered-storage
    path: patches/audit-disallow-undiscovered-storage.yaml
  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: disallow-tenant-media-payloads
    path: patches/audit-disallow-tenant-media-payloads.yaml
  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: require-zero-site-capacity
    path: patches/audit-require-zero-site-capacity.yaml
  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: require-exact-tenant-networking
    path: patches/audit-require-exact-tenant-networking.yaml
  - target:
      group: kyverno.io
      version: v1
      kind: ClusterPolicy
      name: require-release-readiness
    path: patches/audit-require-release-readiness.yaml
