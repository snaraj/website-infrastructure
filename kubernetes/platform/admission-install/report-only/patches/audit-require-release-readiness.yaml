# Stage 1 report-only downgrade for policies/kyverno/require-release-readiness.yaml.
#
# ONE PAIR PER RULE, AND EVERY PAIR IS BOUND TO ITS RULE'S NAME.
#
# RFC 6902 addresses list elements by POSITION, and a position is not an
# identity. #87 added a rule to require-release-readiness at index 0, every
# later rule shifted down one, and this overlay — which named indices 0,1,2 —
# went on downgrading three rules that were no longer the three it was written
# for while the fourth kept `failureAction: Enforce` into the FAIL-OPEN stage.
# The merge was textually clean and semantically broken, and nothing in either
# change was wrong on its own.
#
# The `test` op is what turns a position back into an identity: kustomize
# evaluates it and FAILS THE RENDER — `testing value /spec/rules/N/name failed`
# — the moment a rule is renamed, reordered, or inserted ahead of this one. It
# is deliberately not a wildcard: adding a rule to a committed policy is an
# admission-semantics decision that has to be reviewed for stage 1, not
# absorbed silently. `test_every_committed_rule_has_a_report_only_downgrade`
# asserts the NAMES here equal the policy's declared rule names, in order and
# in number, so an added rule fails the suite as well as the render.
- op: test
  path: /spec/rules/0/name
  value: require-connector-identity-tuple
- op: replace
  path: /spec/rules/0/validate/failureAction
  value: Audit
- op: test
  path: /spec/rules/1/name
  value: require-replicaset-owned-by-exact-deployment
- op: replace
  path: /spec/rules/1/validate/failureAction
  value: Audit
- op: test
  path: /spec/rules/2/name
  value: require-site-deployment-readiness
- op: replace
  path: /spec/rules/2/validate/failureAction
  value: Audit
- op: test
  path: /spec/rules/3/name
  value: require-tunnel-token-revision
- op: replace
  path: /spec/rules/3/validate/failureAction
  value: Audit
