apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-public
  namespace: cloudflare-public
  annotations:
    platform.snaraj.dev/readiness: suspended-until-sops-token-and-cloudflare-plan
spec:
  suspend: true
  interval: 10m0s
  # Helm keeps every release revision as a Secret in this namespace, and
  # helm-controller retains five when this field is unset. `storage.Create`
  # prunes history to maxHistory-1 BEFORE writing the new revision, so a
  # retention default that can reach the namespace Secret budget wedges the
  # release permanently: the prune frees nothing, the create is denied by
  # quota, and no reconcile can recover it (issue #198, measured on the site
  # releases). This namespace's budget must also hold the reviewed SOPS tunnel
  # credential for each connector, so retention is bounded here for the same
  # reason rather than left to consume the margin those Secrets need.
  maxHistory: 2
  releaseName: cloudflare-public
  serviceAccountName: helm-reconciler
  chart:
    spec:
      chart: ./kubernetes/platform/cloudflare-public/chart
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: cloudflare-public-source
      interval: 10m0s
  install:
    remediation:
      retries: 0
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 0
      strategy: rollback
  values:
    connectors:
      naranjo-online:
        tokenRevision: not-configured
      lidersea-com:
        tokenRevision: not-configured
