replicaCount: 2

image:
  repository: cloudflare/cloudflared
  tag: "2026.7.3"
  digest: sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
  pullPolicy: IfNotPresent

tunnel:
  secretKey: token
  # Change this non-secret revision in the same reviewed PR as a token rotation.
  # Shared by both connectors so a coordinated rotation restarts both Pods; a
  # per-site rotation still lands as its own reviewed change to this value.
  tokenRevision: not-configured

# One connector per website, each an independent Cloudflare Tunnel with its own
# runtime token Secret (ADR 0015). The instance is the site-scoped identity the
# NetworkPolicies pin on both legs; the secretName is referenced by NAME only —
# the token value lives only in a cluster Secret, never in this chart.
connectors:
  - instance: naranjo-online-tunnel
    secretName: naranjo-online-tunnel-token
    origin:
      namespace: naranjo-online
      podLabels:
        app.kubernetes.io/name: naranjo-online
      port: 8080
  - instance: lidersea-com-tunnel
    secretName: lidersea-com-tunnel-token
    origin:
      namespace: lidersea-com
      podLabels:
        app.kubernetes.io/name: lidersea-com
      port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
