{{- /*
Explicit site order keeps the rendered document sequence fixed and auditable.
Each connector's annotation reads ITS OWN tokenRevision, so rotating one
Tunnel leaves the other Deployment byte-for-byte unchanged (ADR 0015's
one-Tunnel-at-a-time rotation).
*/ -}}
{{- range $site := list "naranjo-online" "lidersea-com" }}
{{- $connector := index $.Values.connectors $site }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $connector.instance }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "cloudflare-public.connectorLabels" (dict "root" $ "instance" $connector.instance) | nindent 4 }}
spec:
  replicas: {{ $.Values.replicaCount }}
  revisionHistoryLimit: 3
  {{- /*
  Reconciled to the cluster on 2026-08-12. On a single node, surge-then-drain
  cannot place the extra Pod anywhere useful and its headroom has to be paid
  for out of the same namespace quota that bounds the steady state; taking one
  connector down and replacing it is what actually completes here. The tunnel
  drains in seconds and the other website's connector is untouched, which is
  the same one-at-a-time property ADR 0015 gives rotation.
  */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cloudflare-public.name" $ }}
      app.kubernetes.io/instance: {{ $connector.instance }}
  template:
    metadata:
      labels:
        {{- include "cloudflare-public.connectorLabels" (dict "root" $ "instance" $connector.instance) | nindent 8 }}
      annotations:
        platform.snaraj.dev/tunnel-token-revision: {{ $connector.tokenRevision | quote }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: cloudflared
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}@{{ $.Values.image.digest }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token-file
            - /etc/cloudflared/token/token
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ready
              port: metrics
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 2
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tunnel-token
              mountPath: /etc/cloudflared/token
              readOnly: true
      volumes:
        - name: tunnel-token
          secret:
            secretName: {{ $connector.secretName }}
            defaultMode: 0440
            items:
              - key: {{ $.Values.tunnel.secretKey }}
                path: token
{{- end }}
