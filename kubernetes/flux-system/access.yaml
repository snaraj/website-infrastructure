apiVersion: v1
kind: ServiceAccount
metadata:
  name: admission-reconciler
  namespace: flux-system
automountServiceAccountToken: false
---
# Staging authority is intentionally namespaced. It can own the inert controller
# shell but cannot create CRDs, ClusterPolicies, cluster RBAC, or admission
# webhooks. A future promotion must replace this Role with separately reviewed,
# least-privilege bootstrap authority at the same time as official image digests.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: admission-reconciler
  namespace: kyverno
rules:
  - apiGroups: [""]
    resources: [configmaps, services, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admission-reconciler
  namespace: kyverno
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: admission-reconciler
subjects:
  - kind: ServiceAccount
    name: admission-reconciler
    namespace: flux-system
