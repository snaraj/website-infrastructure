apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-reconciler
  namespace: naranjo-online
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-reconciler
  namespace: lidersea-com
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: helm-reconciler
  namespace: naranjo-online
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  # Issue #211: the naranjo usage-export chart owns two claims in this
  # namespace. Claim lifecycle does not confer authority over the backing PV,
  # StorageClass, node path, or provisioner.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helm-reconciler
  namespace: naranjo-online
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: helm-reconciler
subjects:
  - kind: ServiceAccount
    name: helm-reconciler
    namespace: naranjo-online
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: helm-reconciler
  namespace: lidersea-com
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helm-reconciler
  namespace: lidersea-com
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: helm-reconciler
subjects:
  - kind: ServiceAccount
    name: helm-reconciler
    namespace: lidersea-com
