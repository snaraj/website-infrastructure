subjects:
  - kind: ServiceAccount
    name: platform-services-reconciler
    namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-release-reconciler
  namespace: naranjo-online
rules:
  # This site's chart arrives as a signed OCI artifact, so the source object
  # this reconciler applies is an OCIRepository. The grant said
  # `gitrepositories` — the kind this namespace held before the move to
  # published charts — which would have denied the very object
  # kubernetes/websites/naranjo-online/source.yaml declares, at the moment the
  # Kustomization was unsuspended. A GitRepository here has no legitimate
  # identity at all (the Conftest tenant-source rule refuses one), so the old
  # kind is removed rather than kept alongside.
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [ocirepositories]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: naranjo-online-reconciler
  namespace: naranjo-online
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-release-reconciler
subjects:
  - kind: ServiceAccount
    name: naranjo-online-reconciler
    namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-release-reconciler
  namespace: lidersea-com
rules:
  # Same correction as the sibling site, derived independently from this
  # namespace's own source object: kubernetes/websites/lidersea-com/source.yaml
  # declares an OCIRepository, so `gitrepositories` was a grant for a kind this
  # reconciler never applies and a denial for the one it does.
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [ocirepositories]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lidersea-com-reconciler
  namespace: lidersea-com
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-release-reconciler
subjects:
  - kind: ServiceAccount
    name: lidersea-com-reconciler
    namespace: flux-system
