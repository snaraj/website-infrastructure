# Bootstrap-owned authorization. Runtime Flux reconcilers cannot modify these
# bindings, which confines workload authority.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: flux-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: cloudflare-public
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: naranjo-online
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: lidersea-com
automountServiceAccountToken: false
---
# Controller identity: what the three installed controllers may do AS
# THEMSELVES. Every object a reconciliation applies is applied by one of the
# impersonated reconciler accounts further down this file, never by a
# controller account, so no application kind appears in this section.
#
# These Roles are the compensating authority for the two narrowing patches in
# controllers/patches/: cluster-reconciler.yaml deletes the generated
# cluster-admin binding, and crd-controller-role.yaml replaces the shared
# ClusterRole's wildcards, cluster-wide Secret reads, and
# `serviceaccounts/token` creation with an enumerated set. The namespaced
# remainder is granted here.
#
# The parts that CANNOT be namespaced live elsewhere on purpose. Each
# controller's authority over its own custom resources is a cluster-wide
# list/watch (`--watch-all-namespaces=true`). Those have to be ClusterRole
# rules. Because crd-controller-role.yaml strips that authority
# from the shared role inside the install transaction, the replacement must be
# created by that same transaction or a fresh install starts controllers that
# cannot sync their caches. Those six objects are therefore part of the install
# root, in controllers/per-controller-rbac.yaml (issues #98 and #186), not this
# file. Bootstrap applies this authorization outside Flux self-reconciliation;
# neither direct site Kustomization can reach or mutate it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-controller-runtime
  namespace: flux-system
rules:
  # Leader election is per-controller and always runs in the namespace the
  # controller Pod lives in, so it is namespaced rather than cluster-scoped.
  # Losing this grant crashes the Pod at startup — a loud failure, never a
  # silent half-reconciliation.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  # The only ConfigMaps a controller writes are its own, in its own namespace.
  # Cluster-wide read stays in the shared ClusterRole for `substituteFrom`;
  # the write half is confined here.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps/status]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-controller-runtime
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-controller-runtime
subjects:
  - kind: ServiceAccount
    name: source-controller
    namespace: flux-system
  - kind: ServiceAccount
    name: kustomize-controller
    namespace: flux-system
  - kind: ServiceAccount
    name: helm-controller
    namespace: flux-system
---
# Impersonation is the mechanism that replaces cluster-admin. kustomize-controller
# applies every object as the account named in the Kustomization's
# `spec.serviceAccountName`, and every Kustomization in this repository lives in
# flux-system, so this one namespaced Role — restricted by name to the two
# reconciler accounts that exist — is the controller's entire ability to act on
# a tenant namespace.
#
# `default` is deliberately absent. The controllers run with
# `--default-service-account=default`, so a Kustomization that forgot to name an
# account would fall back to an account this Role does not list: the
# reconciliation stops at the impersonation step with an explicit RBAC denial
# instead of applying anything. The flag and this Role are two independent
# fail-closed layers over the same mistake.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-controller-impersonation
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [impersonate]
    resourceNames:
      - naranjo-online-reconciler
      - lidersea-com-reconciler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-controller-impersonation
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-controller-impersonation
subjects:
  - kind: ServiceAccount
    name: kustomize-controller
    namespace: flux-system
---
# helm-controller resolves `spec.serviceAccountName` in each site's OWN
# namespace, so its impersonation authority is one name-restricted Role per
# site. A namespace with no reconciled HelmRelease gets no Role, and a site
# added later without one denies the release rather than running it with
# borrowed authority.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-controller-impersonation
  namespace: naranjo-online
rules:
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [impersonate]
    resourceNames: [helm-reconciler]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-controller-impersonation
  namespace: naranjo-online
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-controller-impersonation
subjects:
  - kind: ServiceAccount
    name: helm-controller
    namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-controller-impersonation
  namespace: lidersea-com
rules:
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [impersonate]
    resourceNames: [helm-reconciler]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-controller-impersonation
  namespace: lidersea-com
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-controller-impersonation
subjects:
  - kind: ServiceAccount
    name: helm-controller
    namespace: flux-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: naranjo-online-reconciler
  namespace: flux-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lidersea-com-reconciler
  namespace: flux-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-release-reconciler
  namespace: naranjo-online
rules:
  # The direct site Kustomization applies only this default-deny, signed OCI
  # source, and HelmRelease. It has no authority over unrelated paths.
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [ocirepositories]
    verbs: [list]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [ocirepositories]
    verbs: [create]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [ocirepositories]
    resourceNames: [naranjo-online-chart]
    verbs: [get, update, patch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [list]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [create]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    resourceNames: [naranjo-online]
    verbs: [get, update, patch]
  # Kubernetes cannot name-restrict create or list. The direct root contains
  # exactly one NetworkPolicy; every mutating follow-up is restricted to that
  # reviewed default-deny identity so this account cannot rewrite app policy.
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    resourceNames: [default-deny]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: naranjo-online-reconciler
  namespace: naranjo-online
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-release-reconciler
subjects:
  - kind: ServiceAccount
    name: naranjo-online-reconciler
    namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-release-reconciler
  namespace: lidersea-com
rules:
  # Derived independently from this site's three-object Kustomize root.
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [ocirepositories]
    verbs: [list]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [ocirepositories]
    verbs: [create]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [ocirepositories]
    resourceNames: [lidersea-com-chart]
    verbs: [get, update, patch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [list]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [create]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    resourceNames: [lidersea-com]
    verbs: [get, update, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    resourceNames: [default-deny]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lidersea-com-reconciler
  namespace: lidersea-com
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-release-reconciler
subjects:
  - kind: ServiceAccount
    name: lidersea-com-reconciler
    namespace: flux-system
