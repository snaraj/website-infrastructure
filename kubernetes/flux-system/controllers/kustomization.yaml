apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# This root is the reviewed controller install surface: building it yields
# exactly the bytes the install ceremony applies, and it contains no Flux
# custom resource, so applying it reconciles nothing
# (docs/runbooks/flux-install.md).
resources:
  # Generated locally from the pinned Flux CLI before bootstrap.
  - gotk-components.yaml
  # Authored (issue #98). The per-controller replacement for the Flux-group
  # authority that patches/crd-controller-role.yaml removes from the shared
  # ClusterRole. It is a RESOURCE here, not a patch, because the six objects do
  # not exist in the generated export — and it is in THIS root, rather than in
  # access.yaml with the rest of the authored RBAC, because the installer
  # applies only this root. Authority that replaces authority removed in the
  # same transaction has to be created by that transaction.
  - per-controller-rbac.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: source-controller
      namespace: flux-system
    path: patches/source-controller.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kustomize-controller
      namespace: flux-system
    path: patches/kustomize-controller.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: helm-controller
      namespace: flux-system
    path: patches/helm-controller.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: allow-egress
      namespace: flux-system
    path: patches/allow-egress.yaml
  - target:
      version: v1
      kind: Namespace
      name: flux-system
    path: patches/namespace.yaml
  # Authorization narrowing (AUDIT S12). The first patch deletes the generated
  # cluster-admin binding outright; the second replaces the shared controller
  # ClusterRole with the enumerated authority the three installed controllers
  # exercise under their own identity; the third pins the subject list to the
  # ServiceAccounts this install actually creates.
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: cluster-reconciler-flux-system
    path: patches/cluster-reconciler.yaml
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: crd-controller-flux-system
    path: patches/crd-controller-role.yaml
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: crd-controller-flux-system
    path: patches/crd-controller-binding.yaml
