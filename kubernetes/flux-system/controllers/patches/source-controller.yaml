# Pod-level defaults protect current and future sidecars; the generated
# controller already repeats these controls on its manager container.
- op: add
  path: /spec/template/spec/securityContext/runAsNonRoot
  value: true
- op: add
  path: /spec/template/spec/securityContext/seccompProfile
  value:
    type: RuntimeDefault
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --no-cross-namespace-refs=true
- op: add
  path: /spec/template/spec/containers/0/resources/requests/ephemeral-storage
  value: 128Mi
- op: add
  path: /spec/template/spec/containers/0/resources/limits/ephemeral-storage
  value: 1Gi
- op: replace
  path: /spec/template/spec/volumes/0/emptyDir
  value:
    sizeLimit: 768Mi
- op: replace
  path: /spec/template/spec/volumes/1/emptyDir
  value:
    sizeLimit: 128Mi
