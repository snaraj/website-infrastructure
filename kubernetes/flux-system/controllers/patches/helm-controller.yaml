# Pod-level defaults protect current and future sidecars; the generated
# controller already repeats these controls on its manager container.
- op: add
  path: /spec/template/spec/securityContext/runAsNonRoot
  value: true
- op: add
  path: /spec/template/spec/securityContext/seccompProfile
  value:
    type: RuntimeDefault
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --no-cross-namespace-refs=true
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --default-service-account=default
# The pinned controller otherwise starts cluster-wide metadata informers for
# every ConfigMap and Secret. Kubernetes RBAC has no metadata-only Secret verb,
# and Helm release storage already uses the impersonated tenant reconciler.
# The repository contract permits only inline values and the local cluster;
# valuesFrom, kubeConfig, and namespace redirects are rejected in CI.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --feature-gates=DisableConfigWatchers=true
