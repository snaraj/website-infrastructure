# The generated export grants `resources: ['*'], verbs: ['*']` on six Flux API
# groups plus cluster-wide Secret reads and `serviceaccounts/token` creation.
# That last pair is a cluster-admin equivalent by another route: a token minted
# for any ServiceAccount in any namespace is that account's full authority, and
# a cluster-wide Secret read is every credential the cluster holds. Removing the
# `cluster-admin` binding beside this file would have been cosmetic while these
# rules stood.
#
# This patch replaces the rule list with the authority ALL THREE installed
# controllers exercise in common under their OWN identity. Everything a
# reconciliation applies is applied by an impersonated per-tenant ServiceAccount
# (../../access.yaml), never by these accounts, so no application kind appears
# here at all.
#
# THE SPLIT (issue #98). This ClusterRole is bound to all three controller
# ServiceAccounts at once, so every verb it grants is a verb each controller
# holds over every other one's objects. While it enumerated the Flux API groups,
# that made each controller able to rewrite the OTHER controllers'
# reconciliation specifications — source-controller could patch every
# Kustomization and HelmRelease, kustomize-controller every HelmRelease and
# source, helm-controller every Kustomization and source — and impersonation
# does not contain it, because the victim controller performs the resulting
# reconciliation under the impersonated account's authority.
#
# So NO Flux API group appears here any more. Every `get`/`list`/`watch` over a
# custom resource, every `update`/`patch`, every `/status` and `/finalizers`
# grant, and the HelmChart `create`/`delete` pair now live in the per-controller
# ClusterRoles in ../per-controller-rbac.yaml, each bound to exactly one
# ServiceAccount. What is left is the cluster metadata, event reporting, and
# liveness probe that are identical for all three and confer no authority over
# any controller's execution objects — so leaving them shared costs nothing.
#
# The rule list is REPLACED, not merged, so regenerating gotk-components.yaml
# with a newer Flux CLI cannot silently re-broaden it; a Flux release that needs
# a new permission fails visibly at reconcile time and is added — to the owning
# controller's role, not to this one — under review.
#
# Removed on purpose, each with the evidence that it is unused:
#
#   * notification.toolkit.fluxcd.io, image.toolkit.fluxcd.io, and
#     source.extensions.fluxcd.io — the reviewed component set is
#     source-controller, kustomize-controller, helm-controller, so those CRDs
#     are never installed and no object of those groups can exist.
#   * secrets (shared cluster-wide read) — both reconcilers disable optional
#     ConfigMap/Secret event watchers rather than receiving cluster-wide Secret
#     list/watch, and no controller reads a Secret in flux-system at all. Helm
#     release storage uses each impersonated tenant reconciler's namespaced
#     Role. Every source remains anonymous.
#   * serviceaccounts/token (create) — Flux uses it for cloud-provider workload
#     identity. This cluster authenticates to no provider, and the verb is a
#     cluster-wide privilege-escalation primitive.
#   * configmaps write and configmaps/status, and coordination.k8s.io leases —
#     both are controller-local: leader election and any controller-owned
#     ConfigMap live in flux-system. Namespaced equivalents are bound in
#     ../../access.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crd-controller-flux-system
rules:
  # Read-only, non-credential cluster metadata. Namespace reads back the
  # health-check and pruning paths; ConfigMap reads back
  # `postBuild.substituteFrom`; ServiceAccount reads let a
  # controller resolve the account it is about to impersonate. None of the three
  # carries a credential in this cluster: every ServiceAccount here has
  # `automountServiceAccountToken: false` and no bound Secret. All three
  # controllers need all three reads, and none of them names a controller's
  # execution object, so this rule is shared without creating a deputy.
  - apiGroups: [""]
    resources: [namespaces, serviceaccounts, configmaps]
    verbs: [get, list, watch]
  # Event reporting is cluster-scoped because an Event is written in the
  # namespace of the object it describes, and the reconcilers describe objects
  # in flux-system and in every tenant namespace. `create` and `patch` on Events
  # authorize no read of cluster state and confer no authority over any other
  # resource; losing it would degrade reporting silently, which is the failure
  # mode this whole change exists to prevent.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # Non-resource URLs can only be granted by a ClusterRole. This is the API
  # server liveness ping the controllers use to distinguish an unreachable
  # control plane from a failing reconciliation.
  - nonResourceURLs: [/livez/ping]
    verbs: [head]
