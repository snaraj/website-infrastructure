# The generated export lists seven subject ServiceAccounts while the reviewed
# three-controller component set creates only three. The other four —
# notification-controller, image-reflector-controller,
# image-automation-controller, and source-watcher — name accounts that do not
# exist, so today they grant nothing; the moment any of those controllers were
# added the binding would activate silently, with no review of what it granted.
#
# Pinning the subject list to the accounts the install actually creates makes
# adding a controller a deliberate, reviewed edit of this file. The subject set
# is additionally pinned by scripts/validate_repository.py, by the Conftest rule
# over the rendered output, and by the live-state model in
# bootstrap/flux/bootstrap.sh, so a silent re-broadening fails three ways.
#
# All three controllers still share this ONE binding, and that is now safe:
# after the per-controller split (issue #98) the role it points at grants only
# cluster metadata reads, event reporting, and the liveness probe — nothing that
# names another controller's execution objects. Each controller's own
# `update`/`patch`/`/status`/`/finalizers` authority, and the HelmChart
# `create`/`delete` pair, are bound one subject at a time by the per-controller
# ClusterRoleBindings in ../../access.yaml. A write verb re-added to
# crd-controller-flux-system would be a write verb all three hold, which is why
# the Conftest rule over the rendered output refuses one outright.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crd-controller-flux-system
subjects:
  - kind: ServiceAccount
    name: source-controller
    namespace: flux-system
  - kind: ServiceAccount
    name: kustomize-controller
    namespace: flux-system
  - kind: ServiceAccount
    name: helm-controller
    namespace: flux-system
