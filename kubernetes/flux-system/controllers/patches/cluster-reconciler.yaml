# The generated export binds the built-in `cluster-admin` ClusterRole to the
# kustomize-controller and helm-controller ServiceAccounts, which makes
# flux-system the highest-privilege namespace on the cluster: anyone able to
# write the Git source, or to exec into either Pod, holds every verb on every
# resource in every namespace.
#
# Deleting the binding is safe because the two controllers never apply
# reconciled objects under their own identity. Every Kustomization and every
# HelmRelease in this repository names an explicit `spec.serviceAccountName`,
# so the controllers impersonate a per-tenant reconciler ServiceAccount whose
# authority is the namespaced Role bound to it in ../../access.yaml. The
# authority the controllers keep for themselves is split by scope: their own
# custom resources are in ../per-controller-rbac.yaml; common cluster metadata,
# event reporting, and liveness are in ./crd-controller-role.yaml; namespaced
# leader election, controller-owned ConfigMaps, and impersonation are in
# ../../access.yaml.
#
# `roleRef` is immutable, so this is a deletion rather than a repoint: a live
# cluster that already carries the broad binding is migrated by applying the
# narrowed authority first and deleting this binding afterwards.
$patch: delete
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-reconciler-flux-system
