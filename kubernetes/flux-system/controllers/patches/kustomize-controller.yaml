# Pod-level defaults protect current and future sidecars; the generated
# controller already repeats these controls on its manager container.
- op: add
  path: /spec/template/spec/securityContext/runAsNonRoot
  value: true
- op: add
  path: /spec/template/spec/securityContext/seccompProfile
  value:
    type: RuntimeDefault
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --no-cross-namespace-refs=true
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --no-remote-bases=true
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --default-service-account=default
# The pinned controller otherwise starts cluster-wide metadata informers for
# every ConfigMap and Secret. Kubernetes RBAC has no metadata-only verb, and
# granting Secret list/watch would expose credentials from every namespace.
# Referenced inputs are still fetched by exact name during reconciliation; a
# change is observed on the next interval, retry, source event, or manual run.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --feature-gates=DisableConfigWatchers=true
