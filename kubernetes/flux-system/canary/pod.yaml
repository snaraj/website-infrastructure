apiVersion: v1
kind: Pod
metadata:
  name: flux-api-reachability-canary
  namespace: flux-system
  labels:
    app: source-controller
    app.kubernetes.io/component: source-controller
    app.kubernetes.io/instance: flux-system
    app.kubernetes.io/part-of: flux
spec:
  activeDeadlineSeconds: 60
  automountServiceAccountToken: true
  restartPolicy: Never
  serviceAccountName: source-controller
  terminationGracePeriodSeconds: 1
  nodeSelector:
    kubernetes.io/os: linux
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: kubernetes-api
      # The tag preserves release legibility; the manifest-list digest makes
      # the multi-architecture image immutable for this ARM64 cluster and for
      # the AMD64 offline tests.
      image: registry.k8s.io/kubectl:v1.36.3@sha256:6e4fce3c83651edb91b74bc67701c5cd263dd8aa3cd4254b1798d6425a5ab789
      imagePullPolicy: IfNotPresent
      # InClusterConfig normally receives the Service ClusterIP through these
      # variables. Naming the Service DNS identity instead makes this one
      # authenticated discovery request prove both cluster DNS and the
      # Kubernetes Service/API path. kubeadm certificates cover this standard
      # service identity.
      env:
        - name: KUBERNETES_SERVICE_HOST
          value: kubernetes.default.svc
        - name: KUBERNETES_SERVICE_PORT
          value: "443"
      args:
        - --request-timeout=15s
        - get
        - --raw=/api
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
          ephemeral-storage: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
          ephemeral-storage: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
