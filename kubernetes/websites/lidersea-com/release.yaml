apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lidersea-com
  namespace: lidersea-com
  annotations:
    platform.snaraj.dev/readiness: suspended-until-capacity-lock-build-signature-and-digest
spec:
  suspend: true
  interval: 10m0s
  releaseName: lidersea-com
  serviceAccountName: helm-reconciler
  driftDetection:
    mode: enabled
  # The chart artifact comes from the signature-verified OCIRepository beside
  # this file, so the release this cluster runs is whichever published version
  # its reviewed SemVer range resolves to — no branch head, no raw commit, and
  # no per-release edit here. chartRef carries no namespace, so helm-controller
  # (started with --no-cross-namespace-refs=true) can only ever resolve it
  # inside this site's own namespace.
  chartRef:
    kind: OCIRepository
    name: lidersea-com-chart
  install:
    remediation:
      retries: 0
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 0
      strategy: rollback
  # The platform's own fail-closed release gate, deliberately retained through
  # the move to tag-driven chart sync. These two scalars are the pair the
  # release-state policy classifies and the only pair promote-image.sh
  # advances under review: readiness shut over the all-zeros digest is the
  # `initial` state the release Rego rejects, and a reviewed digest with
  # readiness open is the `promoted` state it accepts. Neither reconciles
  # while spec.suspend above is true. The pair leaves this file only after
  # this site's publisher embeds the built image digest into the published
  # chart (ADR 0016, transition step 1), and then only by a reviewed PR that
  # moves the same denial into the chart (transition step 4).
  values:
    deploymentReady: true
    image:
      repository: ghcr.io/snaraj/lidersea-com
      digest: sha256:4714041a4ab9acf0a514c6f5b690684f74f78bb6d59effbcfd0db2d97f4ce479
