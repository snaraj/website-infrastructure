# naranjo.online's Helm chart is published as a signed OCI artifact by that
# site's own release publisher, so the published version tag — not a branch
# head or a raw commit — is this site's official release identity, and the
# SemVer range below is what selects it. Tracking the chart repository with a
# bounded range is what makes a new published release reach the cluster
# without a human editing desired state.
#
# The chart VERSION and the SIGNING REF are two different things and this file
# uses both. The version is a release tag. The signature is minted by a
# workflow_dispatch run of the publisher selected from that repository's
# protected `main` branch, which its own reviewed release contract enforces, so
# the certificate identity ends in @refs/heads/main. That ref is the stronger
# anchor: a run at a ref executes the workflow definition AT that ref, and
# `refs/heads/main` is the only ref in that repository whose creation and
# update are gated by a ruleset with no bypass actors. Tag creation is not
# restricted there, so a tag-ref identity would be mintable by any holder of
# `contents: write` (ADR 0016 amendment 2026-08-22).
#
# Fail-closed properties this object carries, none of which may be relaxed
# without a reviewed decision:
#
#   * spec.verify is MANDATORY. source-controller refuses to produce an
#     artifact for a chart that carries no cosign signature, or one signed by
#     any identity other than THIS site's release-publisher workflow running on
#     protected `main`. The subject pattern is anchored end to end so the
#     sibling site's publisher, another workflow in the same repository, a run
#     at any other ref — a tag ref included — and any look-alike host are all
#     rejected: the two site identity tuples must never couple (AGENTS.md
#     safety invariant 14).
#   * The SemVer range stays inside major zero while this site's
#     release-policy.env production-graduation gate reads `no` (ADR 0014), and
#     its lower bound is a reviewed ratchet: it denies resolution to any
#     release older than the last reviewed one, so a deleted or re-pointed
#     newer tag cannot silently roll the cluster backwards.
#   * No secretRef, serviceAccountName, certSecretRef, or proxySecretRef: the
#     registry is read anonymously and the cluster holds no registry
#     credential, exactly as it holds no Git credential (ADR 0003, safety
#     invariant 5).
#   * The layer selector pins the Helm chart media type, so a non-chart layer
#     smuggled into the artifact is not what gets reconciled.
#
# The digest-only deploy invariant (safety invariant 6) is unaffected: the
# image digest still reaches the workload as a value, and the chart published
# under this tag is the object that carries it once the site publishers embed
# it at publish time (ADR 0016).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: naranjo-online-chart
  namespace: naranjo-online
spec:
  interval: 10m0s
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    semver: ">=0.1.9 <1.0.0"
  timeout: 60s
  url: oci://ghcr.io/snaraj/charts/naranjo-online
  verify:
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/snaraj/naranjo\.online/\.github/workflows/release-publisher\.yml@refs/heads/main$
    provider: cosign
