apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-undiscovered-storage
  annotations:
    policies.kyverno.io/category: Storage Security
    policies.kyverno.io/description: Keep persistent and node-coupled storage unavailable until Pi discovery and restore evidence are approved.
spec:
  admission: true
  background: true
  validationFailureAction: Enforce
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 10
  rules:
    - name: disallow-persistent-storage-resources
      match:
        any:
          - resources:
              kinds:
                - PersistentVolume
                - PersistentVolumeClaim
                - StorageClass
                - CSIDriver
      validate:
        failureAction: Enforce
        message: Persistent storage resources are forbidden until discovery and restore evidence are approved.
        deny:
          conditions:
            any:
              - key: "{{ request.object.kind || '' }}"
                operator: NotEquals
                value: ""
    - name: disallow-stateful-claim-templates
      match:
        any:
          - resources:
              kinds: [StatefulSet]
      validate:
        failureAction: Enforce
        message: StatefulSets must not create claims before storage discovery.
        pattern:
          spec:
            X(volumeClaimTemplates): "*"
    - name: allow-only-site-scratch-volumes
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [naranjo-online, lidersea-com]
      validate:
        failureAction: Enforce
        message: Site Pods may use only the reviewed bounded memory-backed tmp volume.
        foreach:
          - list: request.object.spec.volumes || `[]`
            pattern:
              name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 16Mi
    - name: allow-only-tunnel-token-volume
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [cloudflare-public]
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: >-
                !has(object.spec.volumes) ||
                (has(object.metadata.labels) &&
                'app.kubernetes.io/instance' in object.metadata.labels &&
                object.metadata.labels['app.kubernetes.io/instance'] in
                ['naranjo-online-tunnel', 'lidersea-com-tunnel'] &&
                object.spec.volumes.all(volume,
                volume.name == 'tunnel-token' && has(volume.secret) &&
                volume.secret.secretName ==
                object.metadata.labels['app.kubernetes.io/instance'] + '-token' &&
                has(volume.secret.defaultMode) && volume.secret.defaultMode == 288 &&
                has(volume.secret.items) && volume.secret.items.size() == 1 &&
                volume.secret.items[0].key == 'token' && volume.secret.items[0].path == 'token'))
              message: Each site connector Pod may mount only its own matching tunnel-token Secret.
    # The token surface the cluster actually runs. Captured live 2026-08-12:
    # both connector Pods declare ZERO volumes and read the credential from
    # `env: TUNNEL_TOKEN` with `valueFrom.secretKeyRef`, so the volume rule
    # above passes them vacuously through its `!has(object.spec.volumes)` arm
    # and the cross-site substitution it refuses was still admitted here. Same
    # derivation, same identity root: the Secret name must equal this Pod's own
    # instance label plus `-token`. `envFrom` is refused outright because a
    # `secretRef` there injects every key of the named Secret with no key
    # selector to bind; the deployed connectors declare none.
    - name: allow-only-own-instance-token-env
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [cloudflare-public]
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: >-
                has(object.metadata.labels) &&
                'app.kubernetes.io/instance' in object.metadata.labels &&
                object.metadata.labels['app.kubernetes.io/instance'] in
                ['naranjo-online-tunnel', 'lidersea-com-tunnel'] &&
                (object.spec.containers +
                (has(object.spec.initContainers) ? object.spec.initContainers : []) +
                (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : []))
                .all(container, !has(container.envFrom) &&
                (!has(container.env) || container.env.all(entry,
                !has(entry.valueFrom) || !has(entry.valueFrom.secretKeyRef) ||
                (entry.valueFrom.secretKeyRef.name ==
                object.metadata.labels['app.kubernetes.io/instance'] + '-token' &&
                entry.valueFrom.secretKeyRef.key == 'token' &&
                !has(entry.valueFrom.secretKeyRef.optional)))))
              message: Each site connector Pod may read its Tunnel token only from its own matching Secret, and never through envFrom.
    - name: disallow-legacy-service-account-token-secrets
      match:
        any:
          - resources:
              kinds: [Secret]
              namespaces: [cloudflare-public, naranjo-online, lidersea-com]
      validate:
        failureAction: Enforce
        message: Legacy ServiceAccount token Secrets are forbidden in tenant namespaces.
        deny:
          conditions:
            any:
              - key: "{{ request.object.type || 'Opaque' }}"
                operator: Equals
                value: kubernetes.io/service-account-token
    - name: disallow-disk-pressure-toleration
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [cloudflare-public, naranjo-online, lidersea-com]
      validate:
        failureAction: Enforce
        message: Public workloads must yield to node DiskPressure.
        foreach:
          - list: request.object.spec.tolerations || `[]`
            deny:
              conditions:
                any:
                  - key: "{{ element.key || '' }}"
                    operator: Equals
                    value: node.kubernetes.io/disk-pressure
    - name: disallow-wildcard-toleration
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [cloudflare-public, naranjo-online, lidersea-com]
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: >-
                !has(object.spec.tolerations) || object.spec.tolerations.all(toleration,
                !((!has(toleration.key) || toleration.key == '') &&
                has(toleration.operator) && toleration.operator == 'Exists'))
              message: Wildcard Exists tolerations are forbidden because they include node DiskPressure.
