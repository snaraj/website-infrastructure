apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-replicaset-admission-identity
  annotations:
    policies.kyverno.io/category: Deployment Safety
    policies.kyverno.io/description: Bind tenant ReplicaSet admission to the built-in Deployment controller and the exact live owner UID.
spec:
  admission: true
  # Admission identity does not exist during background scans. Keeping this
  # rule separate preserves require-release-readiness's background evidence
  # while making request.userInfo legal and reviewable here.
  background: false
  validationFailureAction: Enforce
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 10
  rules:
    # OwnerReference name/kind alone is attacker-controlled. This rule binds
    # admission to the built-in Deployment controller and to the UID of the
    # exact live Deployment in the same namespace. The API lookup is a
    # namespace-local list rather than a URL built from untrusted owner data.
    # Stage 2 remains blocked on #100 until report-only evidence proves the live
    # control plane presents this exact username for ReplicaSet admissions.
    - name: require-replicaset-controller-and-live-owner-uid
      match:
        any:
          - resources:
              kinds: [ReplicaSet]
              namespaces: [cloudflare-public, naranjo-online, lidersea-com, kyverno-validation]
              operations: [CREATE, UPDATE]
      context:
        - name: ownerDeploymentUID
          apiCall:
            urlPath: "/apis/apps/v1/namespaces/{{ request.namespace }}/deployments"
            jmesPath: "items[?metadata.name == '{{ request.object.metadata.ownerReferences[0].name || '' }}'].metadata.uid | [0] || ''"
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: AnyIn
            value: [CREATE, UPDATE]
      validate:
        failureAction: Enforce
        message: Tenant ReplicaSets require the built-in Deployment controller and the exact live same-namespace Deployment UID.
        deny:
          conditions:
            any:
              - key: "{{ request.userInfo.username || '' }}"
                operator: NotEquals
                value: system:kube-controller-manager
              - key: "{{ request.object.metadata.ownerReferences[0].uid || '' }}"
                operator: NotEquals
                value: "{{ ownerDeploymentUID }}"
