# Staged only. The release gate requires Audit to become Enforce after an
# actual-cluster soak with public GHCR pulls and failure-mode recovery tests.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-naranjo-online
  annotations:
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/description: Verify the exact GitHub workflow signature and SLSA provenance bundle.
spec:
  admission: true
  background: false
  validationFailureAction: Audit
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 30
  rules:
    - name: verify-naranjo-online-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [naranjo-online]
      verifyImages:
        - imageReferences: ["ghcr.io/snaraj/naranjo-online@sha256:*"]
          mutateDigest: false
          required: true
          verifyDigest: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: https://github.com/snaraj/website-infrastructure/.github/workflows/publish-naranjo-online-image.yml@refs/heads/main
                    issuer: https://token.actions.githubusercontent.com
                    rekor:
                      url: https://rekor.sigstore.dev
    - name: verify-naranjo-online-provenance
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [naranjo-online]
      verifyImages:
        - imageReferences: ["ghcr.io/snaraj/naranjo-online@sha256:*"]
          type: SigstoreBundle
          mutateDigest: false
          required: true
          verifyDigest: true
          attestations:
            - type: https://slsa.dev/provenance/v1
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        subject: https://github.com/snaraj/website-infrastructure/.github/workflows/publish-naranjo-online-image.yml@refs/heads/main
                        issuer: https://token.actions.githubusercontent.com
                        rekor:
                          url: https://rekor.sigstore.dev
              conditions:
                - all:
                    - key: "{{ buildDefinition.buildType }}"
                      operator: Equals
                      value: https://actions.github.io/buildtypes/workflow/v1
