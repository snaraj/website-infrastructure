apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-release-readiness
  annotations:
    policies.kyverno.io/category: Deployment Safety
    policies.kyverno.io/description: Keep website and tunnel Deployments blocked at admission while their reviewed release sentinels are unresolved.
spec:
  admission: true
  background: true
  validationFailureAction: Enforce
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 10
  rules:
    - name: require-replicaset-owned-by-exact-deployment
      match:
        any:
          - resources:
              kinds: [ReplicaSet]
              namespaces: [cloudflare-public, naranjo-online, lidersea-com]
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: >-
                has(object.metadata.ownerReferences) && object.metadata.ownerReferences.size() == 1 &&
                object.metadata.ownerReferences.all(owner,
                owner.apiVersion == 'apps/v1' && owner.kind == 'Deployment' &&
                has(owner.controller) && owner.controller == true &&
                ((object.metadata.namespace == 'cloudflare-public' && owner.name == 'cloudflared') ||
                (object.metadata.namespace in ['naranjo-online', 'lidersea-com'] &&
                owner.name == object.metadata.namespace)))
              message: Tenant ReplicaSets may be created only by their one exact reviewed Deployment.
    - name: require-site-deployment-readiness
      match:
        any:
          - resources:
              kinds: [Deployment]
              namespaces: [naranjo-online, lidersea-com]
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: >-
                has(object.metadata.annotations) &&
                'platform.snaraj.dev/deployment-ready' in object.metadata.annotations &&
                object.metadata.annotations['platform.snaraj.dev/deployment-ready'] == 'true'
              message: Website Deployment readiness must be explicitly true before admission.
    - name: require-tunnel-token-revision
      match:
        any:
          - resources:
              kinds: [Deployment]
              namespaces: [cloudflare-public]
              names: [cloudflared]
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: >-
                has(object.spec.template.metadata.annotations) &&
                'platform.snaraj.dev/tunnel-token-revision' in object.spec.template.metadata.annotations &&
                object.spec.template.metadata.annotations['platform.snaraj.dev/tunnel-token-revision'] != '' &&
                object.spec.template.metadata.annotations['platform.snaraj.dev/tunnel-token-revision'] != 'not-configured' &&
                object.spec.template.metadata.annotations['platform.snaraj.dev/tunnel-token-revision'] != 'UNRESOLVED'
              message: cloudflared requires a reviewed non-sentinel tunnel token revision before admission.
