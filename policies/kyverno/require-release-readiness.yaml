apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-release-readiness
  annotations:
    policies.kyverno.io/category: Deployment Safety
    policies.kyverno.io/description: Keep website and tunnel Deployments blocked at admission while their reviewed release sentinels are unresolved.
spec:
  admission: true
  background: true
  validationFailureAction: Enforce
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 10
  rules:
    # DECLARATION ORDER IS LOAD BEARING. Kyverno processes rules in order, and
    # `spec.applyRules: One` stops after the first rule that matches and
    # produces a result. The identity binding is therefore declared FIRST: if
    # anything ever short-circuits this policy, it fails safe on the identity
    # root rather than being skipped because an earlier rule already answered
    # for a Deployment that carries a resolved revision. The absent/`All`
    # value is pinned by the connector battery alongside this ordering.
    - name: require-connector-identity-tuple
      match:
        any:
          - resources:
              kinds: [Deployment]
              namespaces: [cloudflare-public]
      validate:
        failureAction: Enforce
        cel:
          expressions:
            # The connector identity tuple is ROOTED IN THE DEPLOYMENT NAME.
            # Deriving the mounted Secret from the instance label alone leaves
            # an internally self-consistent bypass: keep the allowlisted
            # `lidersea-com-tunnel` Deployment name, move its three instance
            # labels AND its Secret to the other site, and every
            # instance-derived check agrees with itself while that Deployment's
            # Pods consume the other website's runtime credential. This rule
            # matches EVERY cloudflare-public Deployment — no `names:` filter
            # to narrow — so an invented connector is refused here too.
            - expression: >-
                object.metadata.name in ['naranjo-online-tunnel', 'lidersea-com-tunnel'] &&
                has(object.metadata.labels) &&
                'app.kubernetes.io/instance' in object.metadata.labels &&
                object.metadata.labels['app.kubernetes.io/instance'] == object.metadata.name &&
                'app.kubernetes.io/instance' in object.spec.selector.matchLabels &&
                object.spec.selector.matchLabels['app.kubernetes.io/instance'] == object.metadata.name &&
                has(object.spec.template.metadata.labels) &&
                'app.kubernetes.io/instance' in object.spec.template.metadata.labels &&
                object.spec.template.metadata.labels['app.kubernetes.io/instance'] == object.metadata.name &&
                (!has(object.spec.template.spec.volumes) ||
                object.spec.template.spec.volumes.all(volume,
                has(volume.secret) &&
                volume.secret.secretName == object.metadata.name + '-token'))
              message: A connector Deployment's instance labels and mounted token Secret must be rooted in its own reviewed Deployment name.
    - name: require-replicaset-owned-by-exact-deployment
      match:
        any:
          - resources:
              kinds: [ReplicaSet]
              namespaces: [cloudflare-public, naranjo-online, lidersea-com, kyverno-validation]
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: >-
                has(object.metadata.ownerReferences) && object.metadata.ownerReferences.size() == 1 &&
                object.metadata.ownerReferences.all(owner,
                owner.apiVersion == 'apps/v1' && owner.kind == 'Deployment' &&
                has(owner.controller) && owner.controller == true &&
                ((object.metadata.namespace == 'cloudflare-public' &&
                owner.name in ['naranjo-online-tunnel', 'lidersea-com-tunnel'] &&
                has(object.metadata.labels) &&
                'app.kubernetes.io/instance' in object.metadata.labels &&
                object.metadata.labels['app.kubernetes.io/instance'] == owner.name &&
                has(object.spec.template.metadata.labels) &&
                'app.kubernetes.io/instance' in object.spec.template.metadata.labels &&
                object.spec.template.metadata.labels['app.kubernetes.io/instance'] == owner.name) ||
                (object.metadata.namespace in ['naranjo-online', 'lidersea-com', 'kyverno-validation'] &&
                owner.name == object.metadata.namespace)))
              message: Tenant ReplicaSets may be created only by their one exact reviewed Deployment, and a connector ReplicaSet must carry its own owner's instance.
    - name: require-site-deployment-readiness
      match:
        any:
          - resources:
              kinds: [Deployment]
              namespaces: [naranjo-online, lidersea-com]
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: >-
                has(object.metadata.annotations) &&
                'platform.snaraj.dev/deployment-ready' in object.metadata.annotations &&
                object.metadata.annotations['platform.snaraj.dev/deployment-ready'] == 'true'
              message: Website Deployment readiness must be explicitly true before admission.
    - name: require-tunnel-token-revision
      match:
        any:
          - resources:
              kinds: [Deployment]
              namespaces: [cloudflare-public]
              # One connector Deployment per website (ADR 0015). Both identities
              # are matched so neither connector can bypass the token-revision
              # gate; the superseded shared `cloudflared` name is gone.
              names: [naranjo-online-tunnel, lidersea-com-tunnel]
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: >-
                has(object.spec.template.metadata.annotations) &&
                'platform.snaraj.dev/tunnel-token-revision' in object.spec.template.metadata.annotations &&
                object.spec.template.metadata.annotations['platform.snaraj.dev/tunnel-token-revision'] != '' &&
                object.spec.template.metadata.annotations['platform.snaraj.dev/tunnel-token-revision'] != 'not-configured' &&
                object.spec.template.metadata.annotations['platform.snaraj.dev/tunnel-token-revision'] != 'UNRESOLVED'
              message: Each site connector requires its own reviewed non-sentinel tunnel token revision before admission.
