apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-restricted-workloads
  annotations:
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/description: Enforce restricted tenant namespaces, Pods, containers, identities, and tokenless workloads.
spec:
  admission: true
  background: true
  validationFailureAction: Enforce
  webhookConfiguration:
    failurePolicy: Fail
    timeoutSeconds: 10
  rules:
    - name: require-restricted-tenant-namespace
      match:
        any:
          - resources:
              kinds: [Namespace]
              names: [cloudflare-public, naranjo-online, lidersea-com]
      validate:
        failureAction: Enforce
        message: Tenant namespaces must pin restricted Pod Security for enforce, audit, and warn.
        pattern:
          metadata:
            labels:
              pod-security.kubernetes.io/enforce: restricted
              pod-security.kubernetes.io/enforce-version: v1.36
              pod-security.kubernetes.io/audit: restricted
              pod-security.kubernetes.io/audit-version: v1.36
              pod-security.kubernetes.io/warn: restricted
              pod-security.kubernetes.io/warn-version: v1.36
    - name: require-restricted-pod
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [cloudflare-public, naranjo-online, lidersea-com]
      validate:
        failureAction: Enforce
        message: Pods must be non-root, RuntimeDefault, tokenless, and outside host namespaces.
        pattern:
          spec:
            automountServiceAccountToken: false
            =(hostIPC): false
            =(hostNetwork): false
            =(hostPID): false
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
    - name: require-secure-containers
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [cloudflare-public, naranjo-online, lidersea-com]
      validate:
        failureAction: Enforce
        message: Every regular, init, and ephemeral container must use the restricted security profile.
        foreach:
          - list: request.object.spec.containers
            pattern:
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  X(add): "*"
                  drop: [ALL]
                =(privileged): false
                readOnlyRootFilesystem: true
          - list: request.object.spec.initContainers || `[]`
            pattern:
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  X(add): "*"
                  drop: [ALL]
                =(privileged): false
                readOnlyRootFilesystem: true
          - list: request.object.spec.ephemeralContainers || `[]`
            pattern:
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  X(add): "*"
                  drop: [ALL]
                =(privileged): false
                readOnlyRootFilesystem: true
          - list: request.object.spec.volumes || `[]`
            pattern:
              X(hostPath): "*"
          - list: request.object.spec.volumes[?projected].projected.sources[] || `[]`
            pattern:
              X(serviceAccountToken): "*"
    - name: disallow-host-ports
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [cloudflare-public, naranjo-online, lidersea-com]
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: >-
                object.spec.containers.all(container,
                !has(container.ports) || container.ports.all(port, !has(port.hostPort) || port.hostPort == 0)) &&
                (!has(object.spec.initContainers) || object.spec.initContainers.all(container,
                !has(container.ports) || container.ports.all(port, !has(port.hostPort) || port.hostPort == 0))) &&
                (!has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(container,
                !has(container.ports) || container.ports.all(port, !has(port.hostPort) || port.hostPort == 0)))
              message: Tenant containers must not bind host ports.
    - name: require-approved-service-account
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [cloudflare-public, naranjo-online, lidersea-com]
      validate:
        failureAction: Enforce
        message: Workload Pods may use only their tokenless application ServiceAccount.
        deny:
          conditions:
            any:
              - key: "{{ request.namespace }}/{{ request.object.spec.serviceAccountName || '' }}"
                operator: NotIn
                value:
                  - naranjo-online/naranjo-online
                  - lidersea-com/lidersea-com
                  - cloudflare-public/cloudflared
    - name: require-container-resources
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [cloudflare-public, naranjo-online, lidersea-com]
      validate:
        failureAction: Enforce
        message: Every regular tenant container must declare CPU and memory requests and limits.
        foreach:
          - list: request.object.spec.containers
            pattern:
              resources:
                requests:
                  cpu: "?*"
                  memory: "?*"
                limits:
                  cpu: "?*"
                  memory: "?*"
