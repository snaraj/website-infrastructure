apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidersea-com
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lidersea-com.labels" . | nindent 4 }}
  annotations:
    # Admission treats this reviewed readiness marker independently from normal
    # Kubernetes probe health; it remains false while release inputs are staged.
    platform.snaraj.dev/deployment-ready: {{ .Values.deploymentReady | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lidersea-com.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "lidersea-com.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: lidersea-com
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lidersea-com
          # Only a full index digest is accepted by the schema; the initial zero
          # digest is intentionally non-runnable until promotion updates it.
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            # A bounded memory-backed /tmp satisfies libraries that expect a
            # scratch path without making the immutable root filesystem writable.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
