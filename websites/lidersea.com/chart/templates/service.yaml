apiVersion: v1
kind: Service
metadata:
  name: lidersea-com
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lidersea-com.labels" . | nindent 4 }}
spec:
  # ClusterIP keeps the origin private; Cloudflare reaches it only through the
  # in-cluster tunnel connector selected by the NetworkPolicy.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "lidersea-com.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
