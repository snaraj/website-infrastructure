version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gomod
    # Both modules deliberately share the reviewed Go toolchain. Grouping only
    # the same dependency across roots removes duplicate review without joining
    # either site's image, release evidence, promotion, or rollback authority.
    directories:
      - /websites/naranjo.online
      - /websites/lidersea.com
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    # A toolchain bump must exercise both Svelte sites in one PR so their
    # canonical version pins and lockfiles cannot drift independently.
    directories:
      - /websites/naranjo.online/frontend
      - /websites/lidersea.com/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    # Builder/runtime changes are reviewed across both Dockerfiles while each
    # site keeps its own later build, scan, publication, and promotion lane.
    directories:
      - /websites/naranjo.online
      - /websites/lidersea.com
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: terraform
    directory: /infrastructure/cloudflare
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
