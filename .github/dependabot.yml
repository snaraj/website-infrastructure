version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: terraform
    # Dependabot does not recurse: each phase root holds its own lockfile-free
    # module, so the glob must name the parents of the actual *.tf files.
    directories:
      - /infrastructure/cloudflare/phases/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
