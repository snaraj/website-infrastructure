version: 2
# The terraform ecosystem is deliberately absent: these phase roots pin the
# provider exactly and carry OpenTofu-generated .terraform.lock.hcl files
# (registry.opentofu.org keys), which Dependabot's terraform updater cannot
# parse — every scan crashed with a TypeError in update_lockfile_declaration.
# Provider bumps are reviewed ceremonies here (pin + hash lockfiles across all
# seven phase roots, regenerated by tofu init), never bot-authored.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
