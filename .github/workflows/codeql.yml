name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 9 * * 2'
  workflow_dispatch:

permissions: {}

# PR-number cancellation collapses superseded analysis for one review. Main,
# schedule, and manual runs bind the exact source SHA, so two rapid main pushes
# cannot cancel one another; only a duplicate analysis of the same SHA can.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.sha || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python requires no build, keeping analysis inside the pinned action.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # The single analysis-scope decision this repository makes lives in
          # the config file, in the tree, with its justification and the gates
          # that still cover the excluded surface. A reviewer sees it in the
          # diff; a UI dismissal would be invisible to every checkout.
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
