name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '37 9 * * 2'
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CodeQL installs a Go compiler tracing wrapper during initialization.
      # Select the exact toolchain first so setup-go cannot replace that wrapper.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # The single analysis-scope decision this repository makes lives in
          # the config file, in the tree, with its justification and the gates
          # that still cover the excluded surface. A reviewer sees it in the
          # diff; a UI dismissal would be invisible to every checkout.
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:${{ matrix.language }}
