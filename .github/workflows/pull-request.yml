name: Pull request

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # PR updates may cancel an older run for that PR. Every main push uses a
  # unique run id, so no later merge can erase an earlier release event.
  group: pull-request-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  repository-and-infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Keep ignored bytecode out of the checkout. Binary caches are neither
      # reviewed source nor an acceptable input to later full-tree scanners.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Fragment proof compares one immutable release input with the exact base.
          fetch-depth: 0
      - name: Enforce the platform release transition
        if: github.event_name != 'workflow_dispatch'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
            first_parent=()
          elif [ "${GITHUB_EVENT_NAME}" = push ] && [ "${GITHUB_REF}" = refs/heads/main ]; then
            base_sha="${PUSH_BASE_SHA}"
            head_sha="${PUSH_HEAD_SHA}"
            test "${head_sha}" = "${GITHUB_SHA}"
            first_parent=(--first-parent)
          else
            printf 'unsupported release-gate event %s on %s\n' "${GITHUB_EVENT_NAME}" "${GITHUB_REF}" >&2
            exit 1
          fi
          python3 -I -B scripts/ci/platform_release_contract.py transition \
            --repository . --base "${base_sha}" --head "${head_sha}" \
            "${first_parent[@]}"
      - name: Install checksum-verified tools
        run: ./scripts/ci/install-tools.sh
      - name: Scan immutable pull-request history
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          fail() {
            printf 'FAIL immutable pull-request history validation.\n' >&2
            exit 1
          }

          readonly oid_pattern='^([0-9a-f]{40}|[0-9a-f]{64})$'

          # Every server-authenticated identity, merge-record and base-tip
          # assertion lives in the script so it is shellcheck-covered and
          # executed against real Git fixtures by tests/security. It prints the
          # verified live base tip, which drives both range-scanning gates
          # below so they can never scan a different range than the one the
          # merge commit proves. The shape is re-checked here rather than
          # trusted: a captured value crossing a process boundary is input.
          base_sha="$(./scripts/ci/verify-pull-request-merge-base.sh)" || fail
          [[ "${base_sha}" =~ ${oid_pattern} ]] || fail
          [[ "${PR_HEAD_SHA}" =~ ${oid_pattern} ]] || fail

          python3 -I -B scripts/validate_publication_history.py \
            --pull-request "${base_sha}" "${PR_HEAD_SHA}" || fail

          expected_version="$(awk -F= '
            $1 == "GITLEAKS_VERSION" && $2 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ {
              count += 1; value = $2
            }
            END { if (count == 1) print value }
          ' versions.env)" || fail
          [[ -n "${expected_version}" ]] || fail
          actual_version="$(gitleaks version 2>/dev/null | tr -d '\r\n')" || fail
          [[ "${actual_version}" == "${expected_version}" || "v${actual_version}" == "${expected_version}" ]] || fail

          old_umask="$(umask)"
          umask 077
          empty_ignore="$(mktemp "${RUNNER_TEMP}/pull-request-gitleaks-ignore.XXXXXX")" || fail
          umask "${old_umask}"
          cleanup() {
            rm -f -- "${empty_ignore}"
          }
          abort() {
            trap - EXIT HUP INT TERM
            cleanup
            exit 1
          }
          trap cleanup EXIT
          trap abort HUP INT TERM
          [[ -f "${empty_ignore}" && ! -L "${empty_ignore}" && ! -s "${empty_ignore}" ]] || fail

          gitleaks git \
            --no-banner \
            --no-color \
            --redact \
            --ignore-gitleaks-allow \
            --gitleaks-ignore-path="${empty_ignore}" \
            --max-archive-depth=1 \
            --max-decode-depth=1 \
            --max-target-megabytes=2 \
            --timeout=120 \
            --config policies/gitleaks.toml \
            --log-opts="${base_sha}..${PR_HEAD_SHA}" \
            . || fail

          [[ -f "${empty_ignore}" && ! -L "${empty_ignore}" && ! -s "${empty_ignore}" ]] || fail
          cleanup || fail
          [[ ! -e "${empty_ignore}" ]] || fail
          trap - EXIT HUP INT TERM
      - name: Validate workflows
        run: actionlint
      - name: Validate Python policy tooling
        # The compile smoke previously named five scripts by hand and had
        # drifted to 5 of 34; git ls-files enrolls every tracked
        # scripts/**/*.py automatically and the count floor refuses a sweep
        # that silently matches too little.
        env:
          SELECTOR_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SELECTOR_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELECTOR_PUSH_BASE_SHA: ${{ github.event.before }}
          SELECTOR_PUSH_HEAD_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          git ls-files -z -- 'scripts/*.py' > "${RUNNER_TEMP}/python-script-list"
          python3 -I -B - "${RUNNER_TEMP}/python-script-list" <<'PY'
          import sys
          from pathlib import Path

          listing = Path(sys.argv[1]).read_bytes()
          scripts = sorted(
              entry.decode("utf-8") for entry in listing.split(b"\x00") if entry
          )
          if len(scripts) < 30:
              raise SystemExit(
                  "compile sweep found only {} tracked scripts/**/*.py files; "
                  "the sweep itself is broken".format(len(scripts))
              )
          for relative in scripts:
              path = Path(relative)
              compile(path.read_bytes(), str(path), "exec", dont_inherit=True)
          print("compiled {} tracked Python scripts".format(len(scripts)))
          PY
          # The complete suite runs once, instrumented, in the coverage step
          # below. Running the identical battery here doubled every PR's test
          # time without adding an independent oracle.
          python3 -B scripts/validate_repository.py all
          selector_base=""
          selector_head=""
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            selector_base="${SELECTOR_PR_BASE_SHA}"
            selector_head="${SELECTOR_PR_HEAD_SHA}"
          elif [ "${GITHUB_EVENT_NAME}" = push ]; then
            selector_base="${SELECTOR_PUSH_BASE_SHA}"
            selector_head="${SELECTOR_PUSH_HEAD_SHA}"
          fi
          if [ -n "${selector_base}" ] && [ -n "${selector_head}" ] && \
             git diff --quiet "${selector_base}" "${selector_head}" -- \
               cmd/platform-release-selector internal/releaseselector go.mod; then
            printf 'Selector build inputs unchanged; skipping duplicate container build.\n'
          else
            selector_export="$(mktemp -d "${RUNNER_TEMP}/selector-rootfs.XXXXXX")"
            selector_tar="${selector_export}/rootfs.tar"
            docker build --network=none \
            --output "type=tar,dest=${selector_tar}" \
            --file cmd/platform-release-selector/Dockerfile .
            python3 -I -B - "${selector_tar}" <<'PY'
          import hashlib
          import sys
          import tarfile

          expected_modes = {
              "usr/local/share": 0o555,
              "usr/local/share/sigstore": 0o555,
              "usr/local/share/sigstore/trusted_root.json": 0o444,
          }
          with tarfile.open(sys.argv[1], mode="r:") as archive:
              members = {}
              for member in archive.getmembers():
                  name = member.name.removeprefix("./").rstrip("/")
                  if name in expected_modes:
                      if name in members:
                          raise SystemExit("duplicate selector rootfs member: " + name)
                      members[name] = member
              if set(members) != set(expected_modes):
                  raise SystemExit("selector trusted-root inventory is incomplete")
              for name, expected_mode in expected_modes.items():
                  member = members[name]
                  if member.mode & 0o7777 != expected_mode:
                      raise SystemExit("unexpected selector rootfs mode: " + name)
              if not members["usr/local/share"].isdir() or not members[
                  "usr/local/share/sigstore"
              ].isdir():
                  raise SystemExit("selector trusted-root parents must be directories")
              root = members["usr/local/share/sigstore/trusted_root.json"]
              if not root.isfile():
                  raise SystemExit("selector trusted root must be a regular file")
              stream = archive.extractfile(root)
              if stream is None or hashlib.sha256(stream.read()).hexdigest() != (
                  "6494e21ea73fa7ee769f85f57d5a3e6a08725eae1e38c755fc3517c9e6bc0b66"
              ):
                  raise SystemExit("selector trusted-root content hash drifted")
          PY
          fi
      - name: Enforce the self-hosted coverage contract
        # Zero-third-party coverage: the one hash-pinned wheel is installed
        # into a disposable venv outside the checkout, the suite runs once
        # instrumented (patch=subprocess so the fail-closed CLI executions
        # count), and scripts/ci/coverage_gate.py enforces the floor, the
        # ledger drift bound, and byte-exact badge regeneration. Nothing is
        # uploaded anywhere; the badge cannot claim what CI did not measure.
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/coverage-venv"
          venv_python="${RUNNER_TEMP}/coverage-venv/bin/python"
          "${venv_python}" -m pip install --quiet --require-hashes \
            --only-binary :all: -r scripts/ci/requirements-coverage.txt
          coverage_data_root="$(mktemp -d "${RUNNER_TEMP}/coverage-data.XXXXXX")"
          export COVERAGE_FILE="${coverage_data_root}/data"
          export COVERAGE_RCFILE="${PWD}/scripts/ci/coveragerc"
          export COVERAGE_SOURCE_ROOT="${PWD}/scripts"
          "${venv_python}" -B -m coverage run -m unittest discover -s tests -p 'test_*.py'
          "${venv_python}" -B -m coverage combine
          "${venv_python}" -B scripts/ci/coverage_gate.py gate --data-file "${COVERAGE_FILE}"
      - name: Check shell
        run: find bootstrap scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck
      - name: Scan current tree for secrets
        run: |
          ambient_python_artifact="$(
            find . \( -type d -name '__pycache__' -o -type f \( -name '*.pyc' -o -name '*.pyo' -o -name '*.pyd' \) \) -print -quit
          )"
          if [ -n "${ambient_python_artifact}" ]; then
            printf 'Generated Python artifact remained in the checkout: %s\n' "${ambient_python_artifact}" >&2
            exit 1
          fi
          gitleaks dir --no-banner --redact --config policies/gitleaks.toml .
      - name: Render and validate Helm and Kubernetes
        run: |
          release_mode="$(python3 -B scripts/validate_release_transition.py select-mode)"
          case "${release_mode}" in
            scaffold|transition|release) ;;
            *) printf 'Unsafe release transition mode.\n' >&2; exit 1 ;;
          esac
          ./scripts/render-kubernetes.sh "--${release_mode}"
          if [ "${release_mode}" = scaffold ]; then
            printf 'PENDING release-state policy: releases remain deliberately suspended.\n'
          fi
      - name: Prove render determinism and validate the assurance ledger
        run: |
          ./scripts/ci/verify-render-determinism.sh
          python3 -B scripts/validate_assurance_ledger.py docs/assurance/evidence-ledger.jsonl
          python3 -B scripts/validate_no_security_toggles.py .
          python3 -B scripts/validate_attack_surface_manifest.py docs/assurance/attack-surface-manifest.json
          python3 -B scripts/validate_ingress_guard.py repo
          python3 -B scripts/validate_admin_ingress_contract.py EXAMPLE bootstrap/pi/ingress-guard/admin-ingress.env.example
      - name: Validate OpenTofu without credentials
        run: ./scripts/validate-cloudflare-iac.sh
      - name: Scan dependencies and full-tree secrets
        run: trivy fs --exit-code 1 --ignore-unfixed --scanners vuln,secret --severity HIGH,CRITICAL .
      - name: Scan IaC and configuration
        # Negative fixtures are rejected by Conftest. Separating
        # this pass keeps them inside the full-tree secret scan above.
        run: >-
          trivy fs --exit-code 1
          --ignorefile policies/trivy-ignore.yaml
          --skip-dirs ./tests/kubernetes/fixtures/deny
          --scanners misconfig
          --severity HIGH,CRITICAL .



  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
