name: Scheduled security

on:
  schedule:
    - cron: '19 10 * * 6'
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified tools
        run: ./scripts/ci/install-tools.sh
      - name: Validate accepted authorization boundary
        # The path-scoped Trivy exception is safe only while the complete Flux
        # ServiceAccount, Role, and RoleBinding file matches its reviewed digest.
        run: python3 -B scripts/validate_repository.py kubernetes
      - name: Scan Git history for secrets
        run: gitleaks git --no-banner --redact --config policies/gitleaks.toml .
      - name: Scan dependencies and full-tree secrets
        run: trivy fs --exit-code 1 --ignore-unfixed --scanners vuln,secret --severity HIGH,CRITICAL .
      - name: Scan IaC and configuration
        # Test fixtures intentionally violate policy and are exercised by the
        # dedicated negative suites; their contents remain secret-scanned.
        run: >-
          trivy fs --exit-code 1
          --ignorefile policies/trivy-ignore.yaml
          --skip-dirs ./tests/kubernetes/fixtures/deny
          --scanners misconfig
          --severity HIGH,CRITICAL .
