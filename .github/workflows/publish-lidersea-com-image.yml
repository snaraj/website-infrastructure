name: Publish lidersea.com image

on:
  push:
    branches: [main]
    paths:
      - websites/lidersea.com/cmd/**
      - websites/lidersea.com/frontend/**
      - websites/lidersea.com/internal/**
      - websites/lidersea.com/.dockerignore
      - websites/lidersea.com/Dockerfile
      - websites/lidersea.com/go.mod
      - websites/lidersea.com/go.sum
      - websites/lidersea.com/VERSION
      - .github/workflows/publish-lidersea-com-image.yml
      - scripts/ci/install-tools.sh
      - scripts/ci/publish-oci-artifact.sh
      - scripts/ci/publish-stable-oci-tag.sh
      - scripts/ci/verify-existing-oci-release.sh
      - scripts/ci/verify-oci-artifact.sh
      - scripts/validate_image_release.py
      - versions.env
  workflow_dispatch:

permissions: {}

concurrency:
  # This release lane is intentionally independent from naranjo.online so a
  # site-specific rollback or rebuild never cancels the other site's evidence.
  group: publish-lidersea-com
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' && github.repository == 'snaraj/website-infrastructure' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/snaraj/lidersea-com
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified scanners and OCI client
        run: ./scripts/ci/install-tools.sh
      - name: Revalidate repository policy on the release commit
        run: python3 scripts/validate_repository.py all
      - name: Revalidate the release version bump on protected-main push
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python3 scripts/validate_image_release.py changed --base "${BASE_SHA}"
      - name: Read validated lidersea.com release version
        id: release
        run: |
          python3 scripts/validate_image_release.py validate --site lidersea-com
          IFS= read -r version < websites/lidersea.com/VERSION
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'tag=v%s\n' "${version}" >> "${GITHUB_OUTPUT}"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build the final multi-architecture OCI artifact once
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: websites/lidersea.com
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/lidersea-com.oci.tar
          push: false
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/snaraj/website-infrastructure
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify and scan exact per-platform views
        env:
          # The shared verifier validates this basename before using it for
          # evidence paths, keeping each site's SBOM names unambiguous.
          ARTIFACT_NAME: lidersea-com
          MAX_APPLICATION_LAYER_BYTES: 16777216
          OCI_ARCHIVE: ${{ runner.temp }}/lidersea-com.oci.tar
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          EVIDENCE_DIR: ${{ runner.temp }}/lidersea-com-evidence
        run: ./scripts/ci/verify-oci-artifact.sh
      - name: Publish the exact scanned OCI graph
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCI_ARCHIVE: ${{ runner.temp }}/lidersea-com.oci.tar
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISH_VERIFY_ROOT: ${{ runner.temp }}/lidersea-com-publish-verify
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          sha_tag="sha-${GITHUB_SHA}"
          tag_list="${RUNNER_TEMP}/lidersea-com.registry-tags"
          tag_error="${RUNNER_TEMP}/lidersea-com.registry-tags.error"
          if ! oras repo tags "${IMAGE}" >"${tag_list}" 2>"${tag_error}"; then
            if grep -Eqi 'NAME_UNKNOWN|name unknown' "${tag_error}"; then
              : >"${tag_list}"
            else
              sed -n '1,20p' "${tag_error}" >&2
              exit 1
            fi
          fi
          assert_expected_mapping() {
            local tag="$1"
            local resolved
            resolved="$(oras resolve "${IMAGE}:${tag}")"
            [[ "${resolved}" == "${EXPECTED_DIGEST}" ]] || {
              printf 'refusing to reassign immutable tag %s\n' "${tag}" >&2
              exit 1
            }
          }
          if grep -Fxq "${sha_tag}" "${tag_list}"; then
            assert_expected_mapping "${sha_tag}"
          fi
          if grep -Fxq "${RELEASE_TAG}" "${tag_list}"; then
            assert_expected_mapping "${RELEASE_TAG}"
          fi
          ./scripts/ci/publish-oci-artifact.sh
          test "$(oras resolve "${IMAGE}:sha-${GITHUB_SHA}")" = "${EXPECTED_DIGEST}"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign immutable image digest
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # GitHub storage records are organization-only; this repository is
          # user-owned, while registry and repository attestations still work.
          create-storage-record: false
      - name: Verify keyless signature identity
        run: |
          cosign verify \
            --certificate-identity 'https://github.com/snaraj/website-infrastructure/.github/workflows/publish-lidersea-com-image.yml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Publish immutable stable release name
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          STABLE_TAG_VERIFY_ROOT: ${{ runner.temp }}/lidersea-com-stable-tag
        run: bash ./scripts/ci/publish-stable-oci-tag.sh
      - name: Record non-secret release evidence
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          printf '%s\n' "${EXPECTED_DIGEST}" > "${RUNNER_TEMP}/lidersea-com.digest"
          jq -n \
            --arg site 'lidersea-com' \
            --arg image "${IMAGE}" \
            --arg version "${RELEASE_VERSION}" \
            --arg tag "${RELEASE_TAG}" \
            --arg revision "${GITHUB_SHA}" \
            --arg digest "${EXPECTED_DIGEST}" \
            '{site: $site, image: $image, version: $version, tag: $tag, revision: $revision, digest: $digest}' \
            > "${RUNNER_TEMP}/lidersea-com.release.json"
          {
            printf '### lidersea-com %s\n\n' "${RELEASE_TAG}"
            printf -- "- Revision: \`%s\`\n" "${GITHUB_SHA}"
            printf -- "- Digest: \`%s\`\n" "${EXPECTED_DIGEST}"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload SBOM and release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lidersea-com-release-evidence-${{ steps.release.outputs.tag }}
          path: |
            ${{ runner.temp }}/lidersea-com.digest
            ${{ runner.temp }}/lidersea-com.release.json
            ${{ runner.temp }}/lidersea-com-evidence/lidersea-com-amd64.spdx.json
            ${{ runner.temp }}/lidersea-com-evidence/lidersea-com-arm64.spdx.json
          if-no-files-found: error
          retention-days: 14

  verify-existing:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'snaraj/website-infrastructure' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/snaraj/lidersea-com
    steps:
      - name: Check out selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-verified OCI client
        run: ./scripts/ci/install-tools.sh
      - name: Revalidate repository and release version
        id: release
        run: |
          python3 scripts/validate_repository.py all
          python3 scripts/validate_image_release.py validate --site lidersea-com
          IFS= read -r version < websites/lidersea.com/VERSION
          printf 'tag=v%s\n' "${version}" >> "${GITHUB_OUTPUT}"
      - name: Log in to GHCR read-only
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify existing immutable names and keyless identity without writes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERIFY_ERROR_ROOT: ${{ runner.temp }}/lidersea-com-read-only-verify
          WORKFLOW_IDENTITY: https://github.com/snaraj/website-infrastructure/.github/workflows/publish-lidersea-com-image.yml@refs/heads/main
        run: bash ./scripts/ci/verify-existing-oci-release.sh
