# Positive control for a selected CNI that enforces NetworkPolicy before
# kube-proxy translation. Pods reach the one kubernetes.default Service VIP on
# TCP 443; the runtime contract separately cross-checks that exact /32 and port
# against the live Service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kyverno-kube-apiserver
  namespace: kyverno
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: kyverno
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.0.2.30/32
      ports:
        - port: 443
          protocol: TCP
