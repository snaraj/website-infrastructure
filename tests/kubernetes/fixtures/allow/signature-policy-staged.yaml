# The report-only install stage's shape for a signature policy: the reviewed
# bytes with `failurePolicy: Ignore`, and nothing else changed.
#
# Stage 1 exists so that an unreachable admission controller cannot refuse
# writes. These policies match Pod creation in the site namespaces, so leaving
# them fail-closed during staging would mean an unhealthy Kyverno stops the
# sites from restarting — the precise outcome the fail-open stage prevents.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-naranjo-online
  annotations:
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/description: Verify the exact GitHub workflow signature and SLSA provenance bundle.
spec:
  admission: true
  background: false
  validationFailureAction: Audit
  webhookConfiguration:
    failurePolicy: Ignore
    timeoutSeconds: 30
  rules:
    - name: verify-naranjo-online-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [naranjo-online]
      verifyImages:
        - imageReferences: ["ghcr.io/snaraj/naranjo-online@sha256:*"]
          mutateDigest: false
          required: true
          verifyDigest: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: https://github.com/snaraj/naranjo.online/.github/workflows/release-publisher.yml@refs/tags/v*
                    issuer: https://token.actions.githubusercontent.com
                    rekor:
                      url: https://rekor.sigstore.dev
    - name: verify-naranjo-online-provenance
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [naranjo-online]
      verifyImages:
        - imageReferences: ["ghcr.io/snaraj/naranjo-online@sha256:*"]
          type: SigstoreBundle
          mutateDigest: false
          required: true
          verifyDigest: true
          attestations:
            - type: https://slsa.dev/provenance/v1
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        subject: https://github.com/snaraj/naranjo.online/.github/workflows/release-publisher.yml@refs/tags/v*
                        issuer: https://token.actions.githubusercontent.com
                        rekor:
                          url: https://rekor.sigstore.dev
              conditions:
                - all:
                    - key: "{{ buildDefinition.buildType }}"
                      operator: Equals
                      value: https://actions.github.io/buildtypes/workflow/v1
