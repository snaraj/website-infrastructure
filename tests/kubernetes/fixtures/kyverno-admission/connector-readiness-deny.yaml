# P1-1 negative controls for the enforce-mode readiness policy. Each resource
# is otherwise well formed so the identity/revision condition under test is the
# sole reason it is refused.
#
# These resources live outside fixtures/deny because Conftest does not evaluate
# token revisions at all and denies every raw tenant ReplicaSet regardless of
# owner — neither would prove the ADMISSION identities. They are exercised only
# by `kyverno test`.
#
# 1. The superseded shared `cloudflared` owner: after the rename no such
#    Deployment exists, so a ReplicaSet claiming it must be refused.
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: cloudflared-legacy-owner
  namespace: cloudflare-public
  ownerReferences:
    - apiVersion: apps/v1
      kind: Deployment
      name: cloudflared
      controller: true
      blockOwnerDeletion: true
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-public
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-public
        app.kubernetes.io/instance: naranjo-online-tunnel
      annotations:
        platform.snaraj.dev/tunnel-token-revision: rev-reviewed-fixture
    spec:
      automountServiceAccountToken: false
      serviceAccountName: cloudflared
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
---
# 2. An invented connector identity outside the reviewed two-site inventory.
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: invented-connector-owner
  namespace: cloudflare-public
  ownerReferences:
    - apiVersion: apps/v1
      kind: Deployment
      name: third-site-tunnel
      controller: true
      blockOwnerDeletion: true
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-public
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-public
        app.kubernetes.io/instance: third-site-tunnel
      annotations:
        platform.snaraj.dev/tunnel-token-revision: rev-reviewed-fixture
    spec:
      automountServiceAccountToken: false
      serviceAccountName: cloudflared
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
