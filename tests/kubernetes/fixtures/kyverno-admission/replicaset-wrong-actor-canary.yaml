apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: naranjo-online-wrong-actor-deny
  namespace: naranjo-online
  ownerReferences:
    - apiVersion: apps/v1
      kind: Deployment
      name: naranjo-online
      uid: live-owner-uid
      controller: true
      blockOwnerDeletion: true
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: naranjo-online-wrong-actor-deny}
  template:
    metadata:
      labels: {app.kubernetes.io/name: naranjo-online-wrong-actor-deny}
    spec:
      containers:
        - name: canary
          image: ghcr.io/snaraj/naranjo-online:v1.0.0@sha256:1111111111111111111111111111111111111111111111111111111111111111
