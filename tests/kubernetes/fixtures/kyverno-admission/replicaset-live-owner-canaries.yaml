# Exact positive control: the built-in Deployment controller presents the UID
# of the live same-namespace Deployment returned by the mocked API call.
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: naranjo-online-live-owner-allow
  namespace: naranjo-online
  ownerReferences:
    - apiVersion: apps/v1
      kind: Deployment
      name: naranjo-online
      uid: live-owner-uid
      controller: true
      blockOwnerDeletion: true
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: naranjo-online-live-owner-allow}
  template:
    metadata:
      labels: {app.kubernetes.io/name: naranjo-online-live-owner-allow}
    spec:
      containers:
        - name: canary
          image: ghcr.io/snaraj/naranjo-online:v1.0.0@sha256:1111111111111111111111111111111111111111111111111111111111111111
---
# Same reviewed owner name and namespace, attacker-supplied UID. Name/kind-only
# admission would accept this; the live-owner binding must not.
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: naranjo-online-live-owner-deny
  namespace: naranjo-online
  ownerReferences:
    - apiVersion: apps/v1
      kind: Deployment
      name: naranjo-online
      uid: spoofed-owner-uid
      controller: true
      blockOwnerDeletion: true
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: naranjo-online-live-owner-deny}
  template:
    metadata:
      labels: {app.kubernetes.io/name: naranjo-online-live-owner-deny}
    spec:
      containers:
        - name: canary
          image: ghcr.io/snaraj/naranjo-online:v1.0.0@sha256:1111111111111111111111111111111111111111111111111111111111111111
