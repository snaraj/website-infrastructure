# The generated ReplicaSet/Pod path of the identity-root bypass. A Deployment
# controller creates ReplicaSets carrying its Pod template labels, so if the
# label could be the root of trust an allowlisted owner would mint Pods wearing
# the other site's identity — and the Pod storage rule, which derives the token
# from that same label, would then hand them the other site's Secret. Both
# directions are refused: a connector ReplicaSet must carry its OWN owner's
# instance.
#
# These live outside fixtures/deny because Conftest denies every raw tenant
# ReplicaSet regardless of owner, so it could never prove the admission
# identity; they are exercised only by `kyverno test`.
#
# 1. Dangerous direction: the allowlisted lidersea owner, naranjo labels.
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: lidersea-com-tunnel-9a1e
  namespace: cloudflare-public
  labels:
    app.kubernetes.io/name: cloudflare-public
    app.kubernetes.io/instance: naranjo-online-tunnel
  ownerReferences:
    - apiVersion: apps/v1
      kind: Deployment
      name: lidersea-com-tunnel
      controller: true
      blockOwnerDeletion: true
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-public
      app.kubernetes.io/instance: naranjo-online-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-public
        app.kubernetes.io/instance: naranjo-online-tunnel
      annotations:
        platform.snaraj.dev/tunnel-token-revision: rev-reviewed-fixture
    spec:
      automountServiceAccountToken: false
      serviceAccountName: cloudflared
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tunnel-token
              mountPath: /etc/cloudflared/token
              readOnly: true
      volumes:
        - name: tunnel-token
          secret:
            secretName: naranjo-online-tunnel-token
            defaultMode: 288
            items:
              - key: token
                path: token
---
