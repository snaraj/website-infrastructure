# P1-1 negative controls for the PER-CONNECTOR token-revision gate. Before
# the rename the policy matched only a Deployment named `cloudflared`, so
# both renamed connectors bypassed this gate entirely. Each Deployment here
# is otherwise well formed; the sentinel revision is the sole refusal reason.
# They live in their own Test manifest because they share their exact
# identities with the resolved-revision positive controls.
#
# 1. The naranjo connector with the unresolved sentinel revision.
#    rename this Deployment name was not matched at all, so it bypassed the gate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: naranjo-online-tunnel
  namespace: cloudflare-public
  labels:
    app.kubernetes.io/name: cloudflare-public
    app.kubernetes.io/instance: naranjo-online-tunnel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-public
      app.kubernetes.io/instance: naranjo-online-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-public
        app.kubernetes.io/instance: naranjo-online-tunnel
      annotations:
        platform.snaraj.dev/tunnel-token-revision: not-configured
    spec:
      automountServiceAccountToken: false
      serviceAccountName: cloudflared
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tunnel-token
              mountPath: /etc/cloudflared/token
              readOnly: true
      volumes:
        - name: tunnel-token
          secret:
            secretName: naranjo-online-tunnel-token
            defaultMode: 288
            items:
              - key: token
                path: token
---
# 2. The lidersea connector with the UNRESOLVED sentinel — proving the gate is
#    per connector, not satisfied by the other connector being resolved.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidersea-com-tunnel
  namespace: cloudflare-public
  labels:
    app.kubernetes.io/name: cloudflare-public
    app.kubernetes.io/instance: lidersea-com-tunnel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-public
      app.kubernetes.io/instance: lidersea-com-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-public
        app.kubernetes.io/instance: lidersea-com-tunnel
      annotations:
        platform.snaraj.dev/tunnel-token-revision: UNRESOLVED
    spec:
      automountServiceAccountToken: false
      serviceAccountName: cloudflared
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tunnel-token
              mountPath: /etc/cloudflared/token
              readOnly: true
      volumes:
        - name: tunnel-token
          secret:
            secretName: lidersea-com-tunnel-token
            defaultMode: 288
            items:
              - key: token
                path: token
