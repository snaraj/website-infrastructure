# One reopening of the flux-system egress closure, alone in its own file.
#
# One document per file, and one `expect-deny` per file, is deliberate:
# scripts/test-policy-fixtures.sh asserts that THIS fixture is rejected for THIS
# reason. A multi-document deny fixture asserted at file level cannot do that --
# the other documents keep failing the file while one deny arm is quietly
# neutered, and the suite stays green.
#
# DNS granted to every Pod in the namespace rather than to the controllers, which
# would extend the allow to anything later scheduled there.
# expect-deny: NetworkPolicy flux-system/flux-controllers-dns is outside the exact Flux controller DNS, artifact, public-HTTPS, and API-server egress allowlist
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flux-controllers-dns
  namespace: flux-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
