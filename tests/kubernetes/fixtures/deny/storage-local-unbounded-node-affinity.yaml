# proves: SR-6
# rego-message: must pin itself to named nodes with a bounded required nodeAffinity
# SR-6's actual claim, proven. Required node affinity is PRESENT and structurally
# complete, and `operator: Exists` on kubernetes.io/hostname is satisfied by every
# node that ever joins the cluster — so one reviewed directory is still a
# directory on any machine. A rule whose stated purpose is a node pin must refuse
# a selector that pins nothing.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: storage-local-unbounded
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-pie-ssd
  local:
    path: /mnt/local-pie-ssd/media
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: Exists
