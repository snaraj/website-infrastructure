# proves: SR-3
# rego-message: names a CSI driver outside the enumerated local-provisioner allowlist
# Degenerate shape. `csi:` is declared with a null value, so there is no driver
# name to check against the enumeration. An unreadable driver is not an absent
# driver: the source is still a csi source.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: storage-csi-null
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-pie-ssd
  csi:
