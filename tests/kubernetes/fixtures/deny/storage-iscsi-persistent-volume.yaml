# proves: SR-2
# rego-message: which is not an enumerated local means
# SR-2. A block target over the network is the same exposure as a file share,
# one layer down. Everything else about the object is valid.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: storage-iscsi-source
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-pie-ssd
  iscsi:
    targetPortal: storage.invalid:3260
    iqn: iqn.2026-08.invalid.storage:media
    lun: 0
    fsType: ext4
