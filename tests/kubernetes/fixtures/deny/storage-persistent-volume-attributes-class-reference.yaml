# proves: SR-15
# rego-message: references a VolumeAttributesClass outside the enumerated allowlist
# The reference, not the object. Every other field is admissible; the volume
# names a VolumeAttributesClass, which carries a driver name plus a free-form
# parameter map and can retarget the volume at a backend. SR-14 refuses the
# CLASS; without SR-15 the REFERENCE was ungated by the retained static policy.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: storage-volume-attributes-reference
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-pie-ssd
  volumeAttributesClassName: remote-attributes
  local:
    path: /mnt/local-pie-ssd/media
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [storage-node-placeholder]
