# proves: SR-4
# rego-message: uses local path outside the enumerated local root
# Degenerate shape, fail-closed direction. `local:` is DECLARED with a null
# value. Rego reads the path through a nested object.get, which raises a builtin
# type error on null and — under OPA's default non-strict handling — leaves the
# expression UNDEFINED, so the rule silently did not fire and this object was
# ADMITTED by CI while Kyverno denied it. Both engines must deny it.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: storage-local-null
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-pie-ssd
  local:
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [storage-node-placeholder]
