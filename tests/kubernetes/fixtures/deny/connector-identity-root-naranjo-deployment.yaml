# The identity-root bypass, mirror direction: the ALLOWLISTED
# `naranjo-online-tunnel` Deployment name is kept, while its metadata labels,
# selector, Pod template labels and mounted Secret are coherently moved to the
# lidersea site. Kept as its own fixture because the two directions are
# separate guards in practice — a rule that binds only one of them leaves the
# other open, and a file-level deny assertion over both documents would hide
# exactly that. Denied for the same reason as its twin: the connector identity
# tuple is rooted in metadata.name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: naranjo-online-tunnel
  namespace: cloudflare-public
  labels:
    app.kubernetes.io/name: cloudflare-public
    app.kubernetes.io/instance: lidersea-com-tunnel
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-public
      app.kubernetes.io/instance: lidersea-com-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-public
        app.kubernetes.io/instance: lidersea-com-tunnel
        app.kubernetes.io/managed-by: Helm
      annotations:
        platform.snaraj.dev/tunnel-token-revision: rev-reviewed-fixture
    spec:
      automountServiceAccountToken: false
      serviceAccountName: cloudflared
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: "cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf"
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token-file
            - /etc/cloudflared/token/token
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tunnel-token
              mountPath: /etc/cloudflared/token
              readOnly: true
      volumes:
        - name: tunnel-token
          secret:
            secretName: lidersea-com-tunnel-token
            defaultMode: 288
            items:
              - key: token
                path: token
