apiVersion: v1
kind: Pod
metadata:
  name: denied
  namespace: naranjo-online
spec:
  hostNetwork: true
  initContainers:
    - name: denied-init
      image: docker.io/library/alpine:latest
      securityContext:
        privileged: true
  containers:
    - name: denied
      image: docker.io/library/alpine:latest
      ports:
        - containerPort: 8080
          hostPort: 8080
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Service
metadata:
  name: denied
  namespace: naranjo-online
spec:
  type: LoadBalancer
  externalIPs:
    - 192.0.2.1
  ports:
    - port: 80
