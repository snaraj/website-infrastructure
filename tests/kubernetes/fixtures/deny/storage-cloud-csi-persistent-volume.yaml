# proves: SR-3
# SR-3. The csi source is admitted as a shape, but only for a driver on the
# enumerated local-provisioner allowlist. A cloud block-store driver publishes
# the volume into a provider account, which is the definition of outside.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: storage-cloud-csi
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-pie-ssd
  csi:
    driver: ebs.csi.aws.com
    volumeHandle: vol-invalid
    fsType: ext4
