# proves: SR-6
# rego-message: must pin itself to named nodes with a bounded required nodeAffinity
# Degenerate shape. Historical cross-engine comparison found that `required` as
# a STRING satisfied the retired CEL mirror's presence check while Rego refused
# it. The retained Rego control requires a bounded node selector and never reads
# a scalar as a node pin.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: storage-node-affinity-scalar
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-pie-ssd
  local:
    path: /mnt/local-pie-ssd/media
  nodeAffinity:
    required: anything
