# proves: SR-16
# rego-message: must declare no mountOptions; that is where a remote endpoint would be named
# SR-10's rationale, applied where it equally holds. The volume is local, rooted
# under the enumerated root, node-pinned and enumerated-classed — and its mount
# options name a remote server and an NFS protocol version. mountOptions is where
# a remote endpoint is named on a PersistentVolume exactly as it is on a
# StorageClass.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: storage-mount-options
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-pie-ssd
  mountOptions:
    - addr=storage.invalid
    - vers=4.1
  local:
    path: /mnt/local-pie-ssd/media
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [storage-node-placeholder]
