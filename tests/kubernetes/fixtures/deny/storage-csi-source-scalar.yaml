# proves: SR-3
# Degenerate shape. `csi:` is a STRING that happens to spell a cloud driver
# name. The policy never reads a driver out of it, so the enumeration check
# would have been skipped entirely rather than failed.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: storage-csi-scalar
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-pie-ssd
  csi: ebs.csi.aws.com
