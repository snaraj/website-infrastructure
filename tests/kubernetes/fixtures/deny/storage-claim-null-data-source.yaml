# proves: SR-12
# rego-message: must not populate itself from
# Degenerate shape. `dataSourceRef:` is DECLARED with a null value. A Rego arm
# that compared the value against null admitted it. Declaration, not
# non-nullness, is the retained test; the retired CEL mirror originally exposed
# this mutant.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-null-data-source-claim
  namespace: naranjo-online
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: local-pie-ssd
  resources:
    requests:
      storage: 1Gi
  dataSourceRef:
