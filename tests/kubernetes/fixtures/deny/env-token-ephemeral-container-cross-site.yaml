# The same substitution in an EPHEMERAL container — the shape a debug
# attachment takes. It is an UPDATE to a running Pod rather than a create, so
# it is the one arm that can appear on a Pod that was admitted correctly and is
# already serving; the regular container below is the exact deployed shape.
#
# Without a fixture carrying an ephemeral container at all, dropping them from
# either engine's container walk survives every other row in the matrix.
#
# ONE document per file, deliberately: the fixture runner asserts only that a
# FILE is rejected, so pairing arms in one file would keep the file "rejected"
# while an arm that accepts one of them went unnoticed.
apiVersion: v1
kind: Pod
metadata:
  name: connector-ephemeral-cross-site
  namespace: cloudflare-public
  labels:
    app.kubernetes.io/name: cloudflare-public
    app.kubernetes.io/instance: naranjo-online-tunnel
spec:
  automountServiceAccountToken: false
  serviceAccountName: cloudflared
  securityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: cloudflared
      image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
      args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
      env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: naranjo-online-tunnel-token
              key: token
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 500m, memory: 256Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        readOnlyRootFilesystem: true
  ephemeralContainers:
    - name: debugger
      image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
      env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: lidersea-com-tunnel-token
              key: token
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 500m, memory: 256Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        readOnlyRootFilesystem: true
