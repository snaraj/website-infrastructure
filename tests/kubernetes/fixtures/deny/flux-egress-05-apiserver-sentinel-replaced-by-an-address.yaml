# One reopening of the flux-system egress closure, alone in its own file.
#
# One document per file, and one `expect-deny` per file, is deliberate:
# scripts/test-policy-fixtures.sh asserts that THIS fixture is rejected for THIS
# reason. A multi-document deny fixture asserted at file level cannot do that --
# the other documents keep failing the file while one deny arm is quietly
# neutered, and the suite stays green.
#
# The API-server sentinel replaced by a concrete address. The address here is RFC
# 5737 documentation space, but the rule pins the exact sentinel, so any
# substitution -- including a real control-plane endpoint -- fails the gate
# before it can reach a reviewer.
# expect-deny: NetworkPolicy flux-system/flux-controllers-kube-apiserver is outside the exact Flux controller DNS, artifact, public-HTTPS, and API-server egress allowlist
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flux-controllers-kube-apiserver
  namespace: flux-system
  annotations:
    platform.snaraj.dev/readiness: sentinel-until-reviewed-control-plane-endpoint
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: flux
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 198.51.100.10/32
      ports:
        - port: 6443
          protocol: TCP
