# SR-1 (arity) plus SR-2 (the second source). A reviewer skimming for a local
# path would find one; the object still carries a network source beside it, so
# the arity rule exists to make "the source" a single, readable fact.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: storage-two-sources
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-pie-ssd
  local:
    path: /mnt/local-pie-ssd/media
  nfs:
    server: storage.invalid
    path: /export/media
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: Exists
