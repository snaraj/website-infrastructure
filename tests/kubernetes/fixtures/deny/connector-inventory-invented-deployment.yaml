# A third connector invented inside cloudflare-public. It is internally
# self-consistent — its name, every instance label and its selector all agree —
# so the identity-root binding alone would accept it. Denied because the
# reviewed connector inventory is closed at the two per-site connectors
# (ADR 0015): one Tunnel per website, no more. It also omits the required exact
# instance-derived token reference, so the reviewed denial set records both
# independent controls rather than pretending the inventory rule is sole.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: third-site-tunnel
  namespace: cloudflare-public
  labels:
    app.kubernetes.io/name: cloudflare-public
    app.kubernetes.io/instance: third-site-tunnel
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-public
      app.kubernetes.io/instance: third-site-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-public
        app.kubernetes.io/instance: third-site-tunnel
        app.kubernetes.io/managed-by: Helm
      annotations:
        platform.snaraj.dev/tunnel-token-revision: rev-reviewed-fixture
    spec:
      automountServiceAccountToken: false
      serviceAccountName: cloudflared
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: "cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf"
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
