# A connector Deployment whose `labels` is null rather than a mapping. It
# states no instance at all, so it cannot be proven to be rooted in its own
# Deployment name, and it is refused.
#
# This fixture exists to keep the Rego arm written as a POSITIVE proof that the
# denial NEGATES. Rewritten as a rule that hunts for a mismatch — the natural
# `object.get(object.get(metadata, "labels", {}), ...) != name` shape — the
# builtin type error on this null makes the deny body UNDEFINED under OPA's
# default non-strict mode, the rule silently does not fire, and this document
# is ACCEPTED while every other fixture still fails. Historical comparison to
# the retired CEL mirror exposed that fail-open; this document now pins the
# self-sufficient Rego formulation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidersea-com-tunnel
  namespace: cloudflare-public
  labels: null
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-public
      app.kubernetes.io/instance: lidersea-com-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-public
        app.kubernetes.io/instance: lidersea-com-tunnel
      annotations:
        platform.snaraj.dev/tunnel-token-revision: rev-reviewed-fixture
    spec:
      automountServiceAccountToken: false
      serviceAccountName: cloudflared
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: "cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf"
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
