# The connector's OWN Secret, and a different KEY inside it. Nothing about the
# Secret name is wrong, so a rule that binds only the name admits it — and a
# Secret may hold more than the one reviewed key, so the key is part of the
# reference's identity, not decoration.
#
# ONE document per file, deliberately: the fixture runner asserts only that a
# FILE is rejected, so pairing arms in one file would keep the file "rejected"
# while an arm that accepts one of them went unnoticed.
apiVersion: v1
kind: Pod
metadata:
  name: connector-wrong-token-key
  namespace: cloudflare-public
  labels:
    app.kubernetes.io/name: cloudflare-public
    app.kubernetes.io/instance: naranjo-online-tunnel
spec:
  automountServiceAccountToken: false
  serviceAccountName: cloudflared
  securityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: cloudflared
      image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
      args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
      env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: naranjo-online-tunnel-token
              key: credentials.json
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 500m, memory: 256Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        readOnlyRootFilesystem: true
