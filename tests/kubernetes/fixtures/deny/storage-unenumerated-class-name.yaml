# proves: SR-9
# SR-9. The provisioner is the enumerated static local one, so nothing about
# this class is remote — and it is still denied, because the class inventory is
# enumerated too and a second class must not appear without review.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nas-bulk
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
