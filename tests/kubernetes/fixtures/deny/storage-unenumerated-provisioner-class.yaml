# SR-8. The class identity is the enumerated one, but the provisioner is not.
# The provisioner is what actually decides where bytes land, so it is checked
# independently of the name.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-pie-ssd
provisioner: nfs.csi.k8s.io
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
