apiVersion: v1
kind: Pod
metadata:
  name: token-bypass
  namespace: naranjo-online
spec:
  automountServiceAccountToken: false
  serviceAccountName: helm-reconciler
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: token-bypass
      image: ghcr.io/snaraj/naranjo-online@sha256:1111111111111111111111111111111111111111111111111111111111111111
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
  volumes:
    - name: stolen-api-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 600
