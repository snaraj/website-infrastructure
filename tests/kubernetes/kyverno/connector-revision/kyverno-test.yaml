# The per-connector token-revision gate, proven in the failing direction.
#
# These Deployments carry the SAME exact identities as the resolved-revision
# positive controls in the objective-two battery, so they need their own Test
# manifest: within one manifest a resource identity may appear only once. The
# pairing is the point — same names, opposite revisions, opposite results — so
# the gate is proven to key on the revision, not on the identity.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: connector-token-revision-fail-closed
policies:
  - ../../../../policies/kyverno/require-release-readiness.yaml
resources:
  - ../../fixtures/kyverno-admission/connector-revision-deny.yaml
results:
  - policy: require-release-readiness
    rule: require-tunnel-token-revision
    resources: [naranjo-online-tunnel, lidersea-com-tunnel]
    kind: Deployment
    result: fail
