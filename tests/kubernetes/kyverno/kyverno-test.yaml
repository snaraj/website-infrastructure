apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: website-platform-admission
policies:
  - ../../../policies/kyverno/require-restricted-workloads.yaml
  - ../../../policies/kyverno/disallow-public-services.yaml
  - ../../../policies/kyverno/require-approved-images.yaml
resources:
  - ../fixtures/allow/hardened.yaml
  - ../fixtures/allow/tagged-release-reference.yaml
  - ../fixtures/deny/insecure.yaml
  - ../fixtures/deny/token-bypass.yaml
  - ../fixtures/deny/image-floating-tag.yaml
  - ../fixtures/deny/image-tag-without-digest.yaml
  - ../fixtures/deny/image-unprefixed-release-tag.yaml
  - ../fixtures/deny/image-tag-smuggling-a-registry.yaml
  - ../fixtures/deny/image-sibling-site-repository-tagged.yaml
results:
  - policy: require-restricted-workloads
    rule: require-restricted-pod
    resources: [allowed]
    kind: Pod
    result: pass
  - policy: require-restricted-workloads
    rule: require-secure-containers
    resources: [allowed]
    kind: Pod
    result: pass
  - policy: require-approved-images
    rule: require-approved-digest
    resources: [allowed]
    kind: Pod
    result: pass
  - policy: require-restricted-workloads
    rule: require-approved-service-account
    resources: [allowed]
    kind: Pod
    result: pass
  - policy: require-restricted-workloads
    rule: require-restricted-pod
    resources: [denied]
    kind: Pod
    result: fail
  - policy: require-restricted-workloads
    rule: require-secure-containers
    resources: [denied]
    kind: Pod
    result: fail
  - policy: require-approved-images
    rule: require-approved-digest
    resources: [denied]
    kind: Pod
    result: fail
  - policy: require-restricted-workloads
    rule: require-approved-service-account
    resources: [token-bypass]
    kind: Pod
    result: fail
  - policy: require-restricted-workloads
    rule: require-secure-containers
    resources: [token-bypass]
    kind: Pod
    result: fail
  - policy: disallow-public-services
    rule: disallow-public-service
    resources: [denied]
    kind: Service
    result: fail
  - policy: require-approved-images
    rule: require-approved-digest
    resources: [tagged]
    kind: Pod
    result: pass
  - policy: require-approved-images
    rule: require-canonical-naranjo-image
    resources: [tagged]
    kind: Pod
    result: pass
  - policy: require-approved-images
    rule: require-canonical-naranjo-image
    resources: [image-floating-tag, image-unprefixed-release-tag, image-sibling-site-repository-tagged]
    kind: Pod
    result: fail
  - policy: require-approved-images
    rule: require-approved-digest
    resources: [image-tag-without-digest, image-tag-smuggling-a-registry]
    kind: Pod
    result: fail
