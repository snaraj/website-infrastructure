apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: objective-two-fail-closed-controls
policies:
  - ../../../../policies/kyverno/require-restricted-workloads.yaml
  - ../../../../policies/kyverno/disallow-public-services.yaml
  - ../../../../policies/kyverno/require-approved-images.yaml
  - ../../../../policies/kyverno/disallow-undiscovered-storage.yaml
  - ../../../../policies/kyverno/disallow-tenant-media-payloads.yaml
  - ../../../../policies/kyverno/require-exact-tenant-networking.yaml
  - ../../../../policies/kyverno/require-zero-site-capacity.yaml
  - ../../../../policies/kyverno/require-release-readiness.yaml
resources:
  - ../../fixtures/allow/lidersea-hardened.yaml
  - ../../fixtures/deny/objective2-bypasses.yaml
  - ../../fixtures/deny/connector-token-cross-swap-naranjo.yaml
  - ../../fixtures/deny/connector-token-cross-swap-lidersea.yaml
  - ../../fixtures/deny/tunnel-mount-superseded-token.yaml
  - ../../fixtures/deny/connector-null-volumes.yaml
  - ../../fixtures/kyverno-admission/connector-readiness-allow.yaml
  - ../../fixtures/kyverno-admission/connector-readiness-deny.yaml
  - ../../fixtures/allow/two-connector-networking.yaml
  - ../../fixtures/allow/live-connector-env-token.yaml
  - ../../fixtures/deny/env-token-cross-swap-naranjo.yaml
  - ../../fixtures/deny/env-token-cross-swap-lidersea.yaml
  - ../../fixtures/deny/env-token-superseded-shared.yaml
  - ../../fixtures/deny/env-token-optional-secret.yaml
  - ../../fixtures/deny/env-token-envfrom-cross-site.yaml
  - ../../fixtures/deny/connector-null-env.yaml
  - ../../fixtures/deny/ingress-policy-superseded-name.yaml
results:
  - policy: require-restricted-workloads
    rule: require-restricted-pod
    resources: [lidersea-allowed]
    kind: Pod
    result: pass
  - policy: require-restricted-workloads
    rule: require-secure-containers
    resources: [lidersea-allowed]
    kind: Pod
    result: pass
  - policy: require-restricted-workloads
    rule: disallow-host-ports
    resources: [lidersea-allowed]
    kind: Pod
    result: pass
  - policy: require-restricted-workloads
    rule: require-container-resources
    resources: [lidersea-allowed]
    kind: Pod
    result: pass
  - policy: require-approved-images
    rule: require-approved-digest
    resources: [lidersea-allowed]
    kind: Pod
    result: pass
  - policy: require-approved-images
    rule: require-canonical-lidersea-image
    resources: [lidersea-allowed]
    kind: Pod
    result: pass
  - policy: disallow-public-services
    rule: disallow-public-service
    resources: [lidersea-com]
    kind: Service
    result: pass
  - policy: require-exact-tenant-networking
    rule: exact-site-ingress-and-no-egress
    resources: [ingress-to-lidersea-com]
    kind: NetworkPolicy
    result: pass
  - policy: require-zero-site-capacity
    rule: require-capacity-not-ready-quota
    resources: [capacity-not-ready]
    kind: ResourceQuota
    result: pass
  - policy: disallow-tenant-media-payloads
    rule: bound-configmap-control-data
    resources: [small-control]
    kind: ConfigMap
    result: pass
  - policy: disallow-undiscovered-storage
    rule: allow-only-tunnel-token-volume
    resources: [cloudflared-volume-allowed]
    kind: Pod
    result: pass
  # The token surface the cluster runs: no volumes, credential from
  # env.valueFrom.secretKeyRef. Admissible for BOTH connectors, so the deny
  # rows below cannot be satisfied by a rule that refuses the shape outright.
  - policy: disallow-undiscovered-storage
    rule: allow-only-own-instance-token-env
    resources: [naranjo-connector-env-token, lidersea-connector-env-token]
    kind: Pod
    result: pass
  # The superseded policy NAME, correct in every other field, must stay
  # refused: a rename that merely ADDED the new name would leave an object
  # nothing renders and nothing runs permanently admissible. The engine-side
  # positive control for the new name is the `ingress-to-lidersea-com` pass row
  # above; the naranjo half is proven in Conftest, where allow fixtures are
  # asserted per file rather than by resource name.
  - policy: require-exact-tenant-networking
    rule: exact-site-ingress-and-no-egress
    resources: [cloudflared-to-naranjo-online]
    kind: NetworkPolicy
    result: fail
  - policy: require-restricted-workloads
    rule: require-restricted-pod
    resources: [lidersea-bypass]
    kind: Pod
    result: fail
  - policy: require-restricted-workloads
    rule: disallow-host-ports
    resources: [lidersea-bypass]
    kind: Pod
    result: fail
  - policy: require-approved-images
    rule: require-approved-digest
    resources: [lidersea-bypass]
    kind: Pod
    result: fail
  - policy: require-approved-images
    rule: require-canonical-lidersea-image
    resources: [lidersea-bypass]
    kind: Pod
    result: fail
  - policy: disallow-undiscovered-storage
    rule: allow-only-site-scratch-volumes
    resources: [lidersea-bypass]
    kind: Pod
    result: fail
  - policy: disallow-undiscovered-storage
    rule: disallow-disk-pressure-toleration
    resources: [lidersea-bypass]
    kind: Pod
    result: fail
  - policy: disallow-public-services
    rule: disallow-public-service
    resources: [public-bypass]
    kind: Service
    result: fail
  - policy: disallow-public-services
    rule: disallow-ingress
    resources: [unexpected-hostname]
    kind: Ingress
    result: fail
  - policy: disallow-public-services
    rule: disallow-gateway-api
    resources: [unexpected-hostname]
    kind: Gateway
    result: fail
  - policy: require-exact-tenant-networking
    rule: exact-site-ingress-and-no-egress
    resources: [widened-ingress]
    kind: NetworkPolicy
    result: fail
  - policy: require-exact-tenant-networking
    rule: exact-site-ingress-and-no-egress
    resources: [ingress-to-naranjo-online]
    kind: NetworkPolicy
    result: fail
  # P1-2: neither connector may mount the other site's token, in either
  # direction, even though both token names are individually approved.
  - policy: disallow-undiscovered-storage
    rule: allow-only-tunnel-token-volume
    resources: [naranjo-connector-with-lidersea-token]
    kind: Pod
    result: fail
  - policy: disallow-undiscovered-storage
    rule: allow-only-tunnel-token-volume
    resources: [lidersea-connector-with-naranjo-token]
    kind: Pod
    result: fail
  # The superseded shared token, asserted BEHAVIOURALLY in this engine too.
  # A structural "the literal is absent from the policy" guard cannot see it
  # re-entering by concatenation ('pi-websites' + '-tunnel-token'); this row
  # can, because the Pod is refused on the mount it actually declares.
  - policy: disallow-undiscovered-storage
    rule: allow-only-tunnel-token-volume
    resources: [cloudflared-superseded-token]
    kind: Pod
    result: fail
  # The same substitution on the surface that is DEPLOYED — env.valueFrom
  # .secretKeyRef, no volumes at all — in both directions, plus the superseded
  # shared token by concatenation, an `optional: true` that would let the Pod
  # start with no credential, and the envFrom door that injects every key of
  # the other site's Secret with no key selector to bind.
  - policy: disallow-undiscovered-storage
    rule: allow-only-own-instance-token-env
    resources:
      - naranjo-connector-with-lidersea-token-env
      - lidersea-connector-with-naranjo-token-env
      - connector-with-superseded-shared-token-env
      - connector-with-optional-token-env
      - connector-with-envfrom-cross-site
    kind: Pod
    result: fail
  # An explicitly-null `env`, the same divergence class as the null `volumes`
  # below: CEL's has() is true on it and .all() errors, so this engine refuses
  # it, and Conftest refuses it by a positive proof that goes undefined rather
  # than by iterating nothing.
  - policy: disallow-undiscovered-storage
    rule: allow-only-own-instance-token-env
    resources: [connector-null-env]
    kind: Pod
    result: fail
  # An explicitly-null `volumes`: CEL's has() is true on it and .all() errors,
  # so this engine refuses it. Conftest refuses it too, by an explicit non-list
  # rule rather than by silently iterating nothing — the one shape where the
  # two engines used to disagree.
  - policy: disallow-undiscovered-storage
    rule: allow-only-tunnel-token-volume
    resources: [cloudflared-null-volumes]
    kind: Pod
    result: fail
  # P1-1: connector rollout must be POSSIBLE for the two renamed identities...
  - policy: require-release-readiness
    rule: require-replicaset-owned-by-exact-deployment
    resources: [naranjo-online-tunnel-7d9f, lidersea-com-tunnel-6b2c]
    kind: ReplicaSet
    result: pass
  - policy: require-release-readiness
    rule: require-tunnel-token-revision
    resources: [naranjo-online-tunnel, lidersea-com-tunnel]
    kind: Deployment
    result: pass
  # ...including under the identity-root binding: a canonical connector states
  # its own name in every instance label and mounts the Secret derived from it.
  - policy: require-release-readiness
    rule: require-connector-identity-tuple
    resources: [naranjo-online-tunnel, lidersea-com-tunnel]
    kind: Deployment
    result: pass
  # ...and impossible for the superseded shared owner or an invented connector.
  - policy: require-release-readiness
    rule: require-replicaset-owned-by-exact-deployment
    resources: [cloudflared-legacy-owner, invented-connector-owner]
    kind: ReplicaSet
    result: fail
  # The reconciled connector-egress policies stay admissible under the
  # double-pinned tunnel-egress rule.
  - policy: require-exact-tenant-networking
    rule: exact-tunnel-cross-namespace-egress
    resources: [cloudflared-dns, cloudflared-edge, cloudflared-naranjo-online, cloudflared-lidersea-com]
    kind: NetworkPolicy
    result: pass
  - policy: disallow-undiscovered-storage
    rule: disallow-persistent-storage-resources
    resources: [invented-media]
    kind: PersistentVolumeClaim
    result: fail
  - policy: require-zero-site-capacity
    rule: require-capacity-not-ready-quota
    resources: [invented-capacity]
    kind: ResourceQuota
    result: fail
  - policy: disallow-tenant-media-payloads
    rule: reject-configmap-binary-data
    resources: [media-in-etcd]
    kind: ConfigMap
    result: fail
  - policy: disallow-tenant-media-payloads
    rule: bound-secret-control-data
    resources: [media-in-etcd]
    kind: Secret
    result: fail
  - policy: require-release-readiness
    rule: require-site-deployment-readiness
    resources: [lidersea-not-ready]
    kind: Deployment
    result: fail
  - policy: require-exact-tenant-networking
    rule: exact-site-ingress-and-no-egress
    resources: [endport-widening]
    kind: NetworkPolicy
    result: fail
  - policy: require-restricted-workloads
    rule: require-secure-containers
    resources: [capability-readd]
    kind: Pod
    result: fail
  - policy: disallow-undiscovered-storage
    rule: disallow-wildcard-toleration
    resources: [wildcard-disk-pressure]
    kind: Pod
    result: fail
  - policy: disallow-undiscovered-storage
    rule: allow-only-site-scratch-volumes
    resources: [unlisted-storage-source]
    kind: Pod
    result: fail
  - policy: disallow-undiscovered-storage
    rule: disallow-legacy-service-account-token-secrets
    resources: [helm-reconciler-token]
    kind: Secret
    result: fail
  - policy: disallow-undiscovered-storage
    rule: allow-only-site-scratch-volumes
    resources: [legacy-token-mount]
    kind: Pod
    result: fail
  - policy: disallow-tenant-media-payloads
    rule: bound-configmap-control-data
    resources: [encoded-media-in-data]
    kind: ConfigMap
    result: fail
  - policy: require-release-readiness
    rule: require-replicaset-owned-by-exact-deployment
    resources: [raw-replicaset]
    kind: ReplicaSet
    result: fail
