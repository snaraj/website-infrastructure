# The degenerate-shape half of the identity-root binding, in the admission
# engine. Its own Test manifest because the resource reuses a reviewed
# connector identity, which may appear only once per manifest.
#
# The point of the pairing is cross-engine agreement: Conftest refuses this
# document because the positive identity proof is undefined, and Kyverno
# refuses it because its CEL errors on the same null. A Rego rewrite that
# fails open here would diverge from the engine asserted below.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: connector-identity-degenerate-fail-closed
policies:
  - ../../../../policies/kyverno/require-release-readiness.yaml
resources:
  - ../../fixtures/deny/connector-identity-degenerate-labels.yaml
results:
  - policy: require-release-readiness
    rule: require-connector-identity-tuple
    resources: [lidersea-com-tunnel]
    kind: Deployment
    result: fail
