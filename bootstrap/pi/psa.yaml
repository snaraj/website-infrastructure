apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
  - name: PodSecurity
    configuration:
      apiVersion: pod-security.admission.config.k8s.io/v1
      kind: PodSecurityConfiguration
      defaults:
        enforce: baseline
        enforce-version: "v1.36"
        audit: restricted
        audit-version: "v1.36"
        warn: restricted
        warn-version: "v1.36"
      exemptions:
        usernames: []
        runtimeClasses: []
        namespaces:
          - kube-system
