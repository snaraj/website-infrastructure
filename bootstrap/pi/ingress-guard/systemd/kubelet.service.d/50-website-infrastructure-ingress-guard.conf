# Additive integration point for the platform integrator (SSH-only ingress
# guard, PLAT-DEC-001). Installed by install-ingress-guard.sh as
# /etc/systemd/system/kubelet.service.d/50-website-infrastructure-ingress-guard.conf
# so bootstrap/pi/systemd/kubelet.service itself is never edited.
#
# Requires= makes a failed or absent guard a failed kubelet start job, and
# stopping the guard propagates a stop to kubelet: with the guard unloaded
# there are no reachable control-plane listeners, so the failure mode is
# always CLOSED. After= orders the guard's verified load strictly first.
[Unit]
Requires=website-infrastructure-ingress-guard.service
After=website-infrastructure-ingress-guard.service
