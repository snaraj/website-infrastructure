apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-release-selector
  namespace: flux-system
automountServiceAccountToken: false
# The cluster-scoped native field boundary is bootstrap-owned alongside this
# least-privilege Role; see admission-policy.json and admission-binding.json.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-release-selector
  namespace: flux-system
rules:
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    resourceNames: [flux-system]
    verbs: [get, patch]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    resourceNames: [naranjo-online-reconciler, lidersea-com-reconciler]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-release-selector
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-release-selector
subjects:
  - kind: ServiceAccount
    name: platform-release-selector
    namespace: flux-system
